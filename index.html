<style>
:root{
  --noche:#1C0B2E; --ciruela:#271040; --ciruela-2:#321652; --violeta:#3B1760;
  --lila:#B98AE6; --lila-suave:#8E6AB3; --oro:#D4AF6A; --oro-suave:rgba(212,175,106,.35);
  --luna:#EDE6F5; --bruma:#B6A7C9; --linea:rgba(185,138,230,.18);
  --ok:#8FD3A8; --aviso:#F0C96B; --debe:#EE9A92; --wa:#25D366;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Jost', 'Segoe UI', system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--noche);color:var(--luna);font-family:var(--sans);font-size:16px;line-height:1.55;
  background-image:radial-gradient(ellipse 80% 50% at 85% -10%, rgba(185,138,230,.14), transparent 70%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px;border-radius:4px}
.oculto{display:none!important}
a{color:var(--lila)}

/* Ingreso */
#ingreso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.ingreso-caja{width:100%;max-width:360px;text-align:center}
.ingreso-caja img{width:132px;height:132px;display:block;margin:0 auto 22px}
.ingreso-caja h1{font-family:var(--serif);font-weight:500;font-size:2.4rem;margin:0 0 4px}
.ingreso-caja p{color:var(--bruma);margin:0 0 24px}
.quien-elige{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.quien-elige label{border:1px solid var(--lila-suave);border-radius:10px;padding:10px;cursor:pointer;font-family:var(--serif);font-size:1.25rem}
.quien-elige input{position:absolute;opacity:0}
.quien-elige label:has(input:checked){border-color:var(--oro);color:var(--oro);background:rgba(212,175,106,.08)}
.quien-elige label:has(input:focus-visible){outline:2px solid var(--oro);outline-offset:2px}
.campo{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--lila-suave);background:var(--ciruela);font-size:1rem}
.campo:focus{border-color:var(--oro);outline:none}
textarea.campo{min-height:110px;resize:vertical;line-height:1.5}
select.campo{appearance:auto}
input[type=date].campo,input[type=time].campo{color-scheme:dark}
.recordar{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--bruma);font-size:.92rem;margin:14px 0 20px}
.recordar input{accent-color:var(--oro)}
.btn{background:var(--oro);color:var(--noche);border:0;border-radius:10px;padding:11px 20px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ancho{width:100%}
.error{color:var(--debe);font-size:.92rem;min-height:1.4em;margin-top:14px}

/* Estructura */
header.barra{position:sticky;top:0;z-index:5;background:rgba(28,11,46,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
.barra-in{max-width:1160px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.45rem;font-weight:600;white-space:nowrap}
.marca img{width:38px;height:38px}
.marca small{font-family:var(--sans);font-size:.85rem;font-weight:400;color:var(--bruma);margin-left:6px}
.acciones{margin-left:auto;display:flex;gap:8px}
.btn-sec{background:transparent;border:1px solid var(--lila-suave);color:var(--luna);border-radius:8px;padding:6px 12px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn-sec:hover{border-color:var(--oro);color:var(--oro)}
.btn-sec.oro{border-color:var(--oro);color:var(--oro)}
nav.pestanas{max-width:1160px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.pestanas::-webkit-scrollbar{display:none}
.pestana{background:none;border:0;border-bottom:2px solid transparent;color:var(--bruma);padding:10px 11px 12px;cursor:pointer;white-space:nowrap;font-size:.95rem}
.pestana:hover{color:var(--luna)}
.pestana[aria-selected="true"]{color:var(--oro);border-bottom-color:var(--oro)}
main{max-width:1160px;margin:0 auto;padding:28px 20px 72px}
.actualizado{color:var(--bruma);font-size:.82rem;margin:0 0 18px}
.cabeza{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
h2{font-family:var(--serif);font-weight:500;font-size:1.9rem;margin:0}
h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:34px 0 12px;color:var(--lila)}
.ayuda{color:var(--bruma);margin:6px 0 20px;max-width:66ch}

/* Hoy */
.proximo{padding:6px 0 30px;border-bottom:1px solid var(--linea)}
.proximo small{color:var(--bruma);font-size:.95rem}
.proximo .titulo{font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.05;margin:6px 0 8px}
.proximo .cuando{font-family:var(--serif);font-style:italic;font-size:1.45rem;color:var(--lila)}
.proximo .cupos{margin-top:8px;color:var(--oro)}
.tareas{list-style:none;margin:0;padding:0;border:1px solid var(--linea);border-radius:14px;overflow:hidden;background:var(--ciruela)}
.tarea{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--linea)}
.tarea:first-child{border-top:0}
.tarea .ico{font-size:1.2rem;width:26px;text-align:center;flex:none}
.tarea .txt{flex:1;min-width:0}
.tarea .txt small{display:block;color:var(--bruma);font-size:.85rem}
.tarea .bt{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.arcano-dia{margin-top:14px;border:1px solid var(--oro-suave);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.arcano-dia .num{font-family:var(--serif);font-size:3rem;line-height:1;color:var(--oro)}
.arcano-dia .nom{font-family:var(--serif);font-size:1.5rem}
.arcano-dia small{color:var(--bruma)}

.balanza{margin:36px 0 8px;text-align:center}
.balanza .neta{color:var(--bruma)}
.balanza .neta strong{display:block;font-family:var(--serif);font-weight:600;font-size:2.6rem;color:var(--oro);line-height:1.1;margin-top:2px}
.platillos{display:grid;grid-template-columns:1fr 1px 1fr;margin:24px auto 0;max-width:640px}
.platillos .eje{background:linear-gradient(var(--oro-suave),var(--oro),var(--oro-suave))}
.platillo{padding:6px 18px 10px}
.platillo .quien{font-family:var(--serif);font-size:1.5rem;color:var(--lila)}
.platillo .monto{font-size:1.6rem;font-weight:500;margin-top:2px}
.platillo .detalle{color:var(--bruma);font-size:.85rem;margin-top:4px}
.a-mano{display:inline-flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:20px}
.a-mano span{padding:9px 18px;border:1px solid var(--oro);border-radius:999px;color:var(--oro);font-weight:500}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:14px;overflow:hidden;margin-top:36px}
.cifra{background:var(--ciruela);padding:16px 18px}
.cifra span{display:block;color:var(--bruma);font-size:.88rem}
.cifra b{display:block;font-weight:500;font-size:1.3rem;margin-top:4px}
.cifra b.oro{color:var(--oro)}

/* Tablas */
.herramientas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.buscador{max-width:320px}
.tabla-caja{overflow-x:auto;border:1px solid var(--linea);border-radius:12px;background:var(--ciruela)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th{text-align:left;font-weight:500;color:var(--oro);background:var(--violeta);padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid rgba(185,138,230,.12);vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.acc{white-space:nowrap;text-align:right}
tr:hover td{background:rgba(185,138,230,.05)}
.vacio{padding:26px;text-align:center;color:var(--bruma)}
.estado{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;white-space:nowrap}
.e-ok{background:rgba(143,211,168,.15);color:var(--ok)}
.e-sena{background:rgba(240,201,107,.15);color:var(--aviso)}
.e-debe{background:rgba(238,154,146,.15);color:var(--debe)}
.e-neutro{background:rgba(185,138,230,.15);color:var(--lila)}
.ic{background:none;border:1px solid transparent;border-radius:8px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--bruma);vertical-align:middle;text-decoration:none;font-size:.95rem}
.ic:hover{border-color:var(--lila-suave);color:var(--luna)}
.ic.wa{color:var(--wa)}
.ic.wa svg{width:18px;height:18px}
.ic.apagado{opacity:.3}

.taller{border:1px solid var(--linea);border-radius:14px;background:var(--ciruela);margin-bottom:14px;overflow:hidden}
.taller > button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:6px 20px;width:100%;padding:17px 20px;cursor:pointer}
.taller > button:focus-visible{outline:2px solid var(--oro);outline-offset:-2px}
.taller .nombre{font-family:var(--serif);font-size:1.45rem;font-weight:600;line-height:1.2}
.taller .meta{color:var(--bruma);font-size:.9rem}
.taller .gan{text-align:right}
.taller .gan b{display:block;color:var(--oro);font-size:1.2rem;font-weight:500}
.taller .gan small{color:var(--bruma)}
.taller-detalle{border-top:1px solid var(--linea);padding:18px 20px;background:var(--ciruela-2)}
.mini-cifras{display:flex;flex-wrap:wrap;gap:8px 26px;margin-bottom:16px;font-size:.92rem}
.mini-cifras span{color:var(--bruma)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.78rem;padding:2px 9px;border-radius:999px;border:1px solid var(--lila-suave);color:var(--bruma);background:none;cursor:pointer}
.chip.si{border-color:var(--oro);color:var(--oro)}
.chip:hover{border-color:var(--luna)}

.alertas3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.caja{border:1px solid var(--linea);border-radius:14px;background:var(--ciruela);padding:16px 18px}
.caja h4{font-family:var(--serif);font-size:1.25rem;font-weight:600;margin:0 0 4px;color:var(--oro)}
.caja > p{color:var(--bruma);font-size:.88rem;margin:0 0 10px}
.persona-fila{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(185,138,230,.1)}
.persona-fila span{flex:1;min-width:0}
.persona-fila small{color:var(--bruma)}

.barras{display:grid;gap:10px;max-width:640px}
.barra-fila{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:12px;align-items:center;font-size:.93rem}
.barra-pista{height:10px;background:rgba(185,138,230,.12);border-radius:99px;overflow:hidden}
.barra-pista i{display:block;height:100%;background:linear-gradient(90deg,var(--lila),var(--oro));border-radius:99px}
.dos-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 48px}

/* Calendario */
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-nav b{font-family:var(--serif);font-size:1.5rem;font-weight:600;min-width:190px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:14px;overflow:hidden;margin-top:14px}
.cal .dsem{background:var(--violeta);color:var(--oro);text-align:center;padding:8px 0;font-size:.85rem}
.dia{min-width:0;background:var(--ciruela);min-height:96px;padding:6px 7px;text-align:left;border:0;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--luna)}
.dia:hover{background:var(--ciruela-2)}
.dia.fuera{background:rgba(39,16,64,.45);color:var(--lila-suave)}
.dia.hoy .n{background:var(--oro);color:var(--noche);border-radius:99px;padding:0 7px}
.dia.sel{outline:2px solid var(--oro);outline-offset:-2px}
.dia .n{font-size:.85rem;align-self:flex-start}
.ev{font-size:.74rem;line-height:1.25;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.taller{background:rgba(212,175,106,.2);color:var(--oro)}
.ev.evento{background:rgba(185,138,230,.2);color:var(--lila)}
.ev.cumple{background:rgba(143,211,168,.14);color:var(--ok)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.85rem;color:var(--bruma)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* Modal */
dialog{border:1px solid var(--linea);border-radius:16px;background:var(--ciruela);color:var(--luna);padding:0;width:min(620px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,4,18,.7)}
.modal-cab{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:var(--ciruela);z-index:1}
.modal-cab h3{margin:0;color:var(--luna)}
.modal-cuerpo{padding:18px 20px;overflow-y:auto;max-height:calc(90vh - 140px)}
.modal-pie{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--linea)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--bruma)}
.form label.check{flex-direction:row;align-items:center;gap:8px;color:var(--luna)}
.form label.check input{accent-color:var(--oro);width:18px;height:18px}
.nueva-persona{grid-column:1/-1;border:1px dashed var(--oro-suave);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.comprobante-img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.variables{font-size:.85rem;color:var(--bruma);margin-top:8px}
.variables code{color:var(--oro);background:rgba(212,175,106,.1);padding:1px 5px;border-radius:4px}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--oro);color:var(--noche);padding:10px 18px;border-radius:10px;font-weight:500;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:90vw}
#toast.err{background:var(--debe)}
#cargando{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--bruma);font-family:var(--serif);font-size:1.4rem;font-style:italic}
@media (prefers-reduced-motion:no-preference){
  #cargando img{animation:girar 9s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
}
@media (max-width:640px){
  .barra-in{padding:10px 14px}
  .marca span{display:none}
  main{padding:22px 14px 64px}
  .form,.nueva-persona{grid-template-columns:1fr}
  .platillo .monto{font-size:1.3rem}
  .dia{min-height:54px;padding:4px}
  .ev{font-size:0;padding:0;height:6px;border-radius:3px}
  .tarea{flex-wrap:wrap}
  .tarea .bt{width:100%;justify-content:flex-start;padding-left:40px}
  .arcano-dia{grid-template-columns:auto 1fr}
  .arcano-dia .bt{grid-column:1/-1}
}
</style>
</head>
<body>

<section id="ingreso" class="oculto">
  <form class="ingreso-caja" id="form-ingreso">
    <img data-logo alt="Luz Guía">
    <h1>Luz Guía</h1>
    <p>Panel de talleres</p>
    <div class="quien-elige" role="radiogroup" aria-label="¿Quién entra?">
      <label><input type="radio" name="quien" value="Belu"> Belu</label>
      <label><input type="radio" name="quien" value="Mey"> Mey</label>
    </div>
    <label for="clave" class="oculto">Clave de acceso</label>
    <input class="campo" id="clave" type="password" placeholder="Clave de acceso" autocomplete="current-password" required>
    <label class="recordar"><input type="checkbox" id="recordar" checked> Recordar en este dispositivo</label>
    <button class="btn ancho" type="submit">Entrar</button>
    <div class="error" id="error-ingreso" role="alert"></div>
  </form>
</section>

<div id="app" class="oculto">
  <header class="barra">
    <div class="barra-in">
      <div class="marca"><img data-logo alt=""><span>Luz Guía</span><small id="quien-soy"></small></div>
      <div class="acciones">
        <button class="btn-sec" id="btn-actualizar" type="button">Actualizar</button>
        <button class="btn-sec" id="btn-salir" type="button">Salir</button>
      </div>
    </div>
    <nav class="pestanas" role="tablist" aria-label="Secciones">
      <button class="pestana" role="tab" data-vista="hoy">Hoy</button>
      <button class="pestana" role="tab" data-vista="calendario">Calendario</button>
      <button class="pestana" role="tab" data-vista="talleres">Talleres</button>
      <button class="pestana" role="tab" data-vista="personas">Participantes</button>
      <button class="pestana" role="tab" data-vista="cobros">Cobros</button>
      <button class="pestana" role="tab" data-vista="gastos">Gastos</button>
      <button class="pestana" role="tab" data-vista="reventa">Reventa y stock</button>
      <button class="pestana" role="tab" data-vista="mensajes">Mensajes</button>
      <button class="pestana" role="tab" data-vista="estadisticas">Estadísticas</button>
      <button class="pestana" role="tab" data-vista="historial">Historial</button>
    </nav>
  </header>
  <main id="contenido"></main>
</div>

<div id="cargando" class="oculto"><img data-logo alt="" width="64" height="64" style="margin-right:14px">Consultando las cartas…</div>

<dialog id="modal">
  <div class="modal-cab"><h3 id="modal-titulo"></h3><button class="ic" type="button" data-cerrar aria-label="Cerrar">✕</button></div>
  <div class="modal-cuerpo" id="modal-cuerpo"></div>
  <div class="modal-pie" id="modal-pie"></div>
</dialog>
<div id="toast" class="oculto" role="status"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxy_R5kw6Ee6-WWokJQSvab2L2C-PVQfADBKsm_nlIhp2ic2KuFbwWl_zz5L-rlGCUbyQ/exec';
const LS_CLAVE = 'luzguia_clave', LS_QUIEN = 'luzguia_quien';
let D = null, CLAVE = '', QUIEN = '', VISTA = 'hoy', PEDIDO_PEND = null;
const HOY = new Date(); HOY.setHours(0,0,0,0);
let CAL = { y: HOY.getFullYear(), m: HOY.getMonth(), sel: null };

const WA_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-.9 1.2-.3.2-.6.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.6-2c-.2-.3 0-.5.1-.6l.5-.5.3-.5a.5.5 0 0 0 0-.5c0-.1-.7-1.6-.9-2.2s-.5-.5-.7-.5h-.6a1.1 1.1 0 0 0-.8.4 3.4 3.4 0 0 0-1 2.5 5.9 5.9 0 0 0 1.2 3.1 13.5 13.5 0 0 0 5.2 4.6c1.9.8 2.7.9 3.6.8a3 3 0 0 0 2-1.4 2.5 2.5 0 0 0 .2-1.4c-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>';
const ARCANOS = ['', 'El Mago','La Sacerdotisa','La Emperatriz','El Emperador','El Hierofante','Los Enamorados','El Carro','La Fuerza','El Ermitaño','La Rueda de la Fortuna','La Justicia','El Colgado','La Muerte','La Templanza','El Diablo','La Torre','La Estrella','La Luna','El Sol','El Juicio','El Mundo','El Loco'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ───── Utilidades ───── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(s){ if (s == null || s === '') return 0; if (typeof s === 'number') return s; const t = String(s).replace(/[^\d,.\-]/g,'').replace(/\./g,'').replace(',', '.'); const n = parseFloat(t); return isNaN(n) ? 0 : n; }
const pesos = n => '$' + Math.round(n).toLocaleString('es-AR');
const si = v => v === true || /^(true|verdadero|sí|si)$/i.test(String(v).trim());
function fecha(s){ const m = String(s||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[3], +m[2]-1, +m[1]) : null; }
const iso = d => d ? d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') : '';
const ddmm = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
const lindaFecha = d => d ? DIAS[d.getDay()] + ' ' + ddmm(d) : '';
const diasEntre = (a, b) => Math.round((b - a) / 86400000);
function leerLS(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function guardarLS(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function borrarLS(k){ try { localStorage.removeItem(k); } catch(e){} }
function toast(msg, err){ const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; clearTimeout(t._t); t._t = setTimeout(() => t.className = 'oculto', 3800); }
function reducir(digitos){ let s = digitos.split('').reduce((a, c) => a + (+c || 0), 0); if (s > 22) s = String(s).split('').reduce((a, c) => a + +c, 0); return s; }
function arcanoDelDia(){ const s = reducir(String(HOY.getDate()).padStart(2,'0') + String(HOY.getMonth()+1).padStart(2,'0') + HOY.getFullYear()); return { n: s, nombre: ARCANOS[s] }; }

function waNum(t){
  let d = String(t || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('54')) { d = d.slice(2); if (d.startsWith('9')) d = d.slice(1); }
  d = d.replace(/^0/, '');
  if (d.length === 12) { for (const a of [2,3,4]) { if (d.substr(a,2) === '15') { d = d.slice(0,a) + d.slice(a+2); break; } } }
  return d.length === 10 ? '549' + d : d;
}
const waLink = (tel, msg) => 'https://wa.me/' + waNum(tel) + (msg ? '?text=' + encodeURIComponent(msg) : '');

/* ───── Datos ───── */
const H = n => (D && D.h[n]) || [];
const L = n => (D && D.listas[n]) || [];
function construir(raw){
  const h = {};
  Object.keys(raw.hojas).forEach(n => {
    const cab = raw.hojas[n].cab;
    h[n] = raw.hojas[n].filas.map(f => { const o = { _fila: f[0] }; cab.forEach((c, i) => o[c] = f[i+1]); return o; });
  });
  const res = {};
  (raw.hojas.Resumen ? raw.hojas.Resumen.filas : []).forEach(f => { if (f[1]) res[f[1]] = f[2]; });
  return { h, res, listas: raw.listas || {}, params: raw.params || {inactiva:90, frecuente:3, cumple:7}, actualizado: raw.actualizado, cab: Object.fromEntries(Object.keys(raw.hojas).map(n => [n, raw.hojas[n].cab])) };
}
const taller = id => H('Talleres').find(t => t['ID Taller'] === id);
const persona = id => H('Personas').find(p => p['ID Persona'] === id);
function proximosTalleres(){
  return H('Talleres').map(t => ({ t, f: fecha(t['Fecha']) }))
    .filter(x => x.f && x.f >= HOY && !/Cancelado|Realizado/.test(x.t['Estado']))
    .sort((a, b) => a.f - b.f).map(x => x.t);
}
function tallerAbierto(){ const p = proximosTalleres(); return p.find(t => num(t['Lugares libres']) > 0) || p[0] || null; }

function perfiles(){
  const out = {};
  H('Personas').forEach(p => out[p['ID Persona']] = { p, veces: 0, ultima: null });
  H('Asistencias').forEach(a => {
    const x = out[a['ID Persona']]; if (!x || a['Asistencia'] !== 'Asistió') return;
    x.veces++;
    const t = taller(a['ID Taller']); const f = t && fecha(t['Fecha']);
    if (f && (!x.ultima || f > x.ultima)) x.ultima = f;
  });
  return Object.values(out);
}
function proximoCumple(p){
  const n = fecha(p['Fecha de nacimiento']); if (!n) return null;
  let c = new Date(HOY.getFullYear(), n.getMonth(), n.getDate());

function valorInicial(c, rec, pre){

  else if (c.def === 'yo') return QUIEN;

  if (v === undefined || v === null) return '';
  if (c.t === 'date') { const f = fecha(v); return f ? iso(f) : (/^\d{4}-/.test(v) ? v : ''); }
  if (c.t === 'money' || c.t === 'num') return v === '' ? '' : num(v);
  if (c.t === 'check') return si(v);
  return v;
}

async function subirFoto(arch){
  let base64, mime = arch.type || 'image/jpeg', nombre = arch.name;
  if (/^image\//.test(mime)) {
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = URL.createObjectURL(arch); });
    const esc2 = Math.min(1, 1600 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * esc2); cv.height = Math.round(img.height * esc2);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    base64 = cv.toDataURL('image/jpeg', 0.82).split(',')[1]; mime = 'image/jpeg'; nombre = nombre.replace(/\.\w+$/, '') + '.jpg';
  } else {
    base64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(arch); });
  }
  const d = await enviar({ accion: 'foto', base64, mime, nombre: 'comprobante-' + iso(HOY) + '-' + nombre });
  return d.id;
}

    const r = await fetch(API + '?clave=' + encodeURIComponent(CLAVE) + '&accion=foto&id=' + encodeURIComponent(ref));
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    const src = 'data:' + d.mime + ';base64,' + d.base64;
    const idD = (String(ref).match(/[-\w]{25,}/) || [''])[0];
    $('modal-pie').innerHTML = (idD ? `<a class="btn-sec" href="https://drive.google.com/file/d/${idD}/view" target="_blank" rel="noopener">Abrir en Drive</a>` : '') + '<button class="btn-sec" type="button" data-cerrar>Cerrar</button>';

      ? `<p class="ayuda">Es un PDF.</p><a class="btn" download="comprobante.pdf" href="${src}">Descargar PDF</a>`
      : `<img class="comprobante-img" alt="Comprobante" src="${src}">`;
  } catch (e) { $('modal-cuerpo').innerHTML = `<p class="error">${esc(e.message || 'No se pudo abrir el comprobante.')}</p>`; }
}

function preciosMateriales(){
  const p = {};
  H('Materiales').forEach(m => { const k = m['Se calcula al marcar']; if (k) p[k] = (p[k] || 0) + num(m['Costo unitario']); });
  return p;
}
function costoMateriales(t){
  const precios = preciosMateriales(); let total = 0; const det = {};
  H('Asistencias').filter(a => a['ID Taller'] === t['ID Taller'] && a['Asistencia'] !== 'Canceló').forEach(a => {
    Object.keys(precios).forEach(k => { if (si(a[k])) { total += precios[k]; det[k] = (det[k] || 0) + 1; } });
  });
  return { total, det };
}

function tabla(cols, datos, vacio){
  if (!datos.length) return '<div class="tabla-caja"><div class="vacio">' + esc(vacio) + '</div></div>';
  const th = cols.map(c => `<th${c.num ? ' class="num"' : ''}>${esc(c.t)}</th>`).join('');

const buscarRec = s => { const [hoja, fila] = s.split('|'); return [hoja, H(hoja).find(r => String(r._fila) === fila)]; };

document.addEventListener('click', async e => {
  const t = e.target.closest('button, a'); if (!t) return;
  const ds = t.dataset;
  if (ds.cerrar !== undefined) { $('modal').close(); return; }
  if (ds.vista) { VISTA = ds.vista; pintar(); window.scrollTo(0, 0); return; }
  if (ds.nuevo) { PEDIDO_PEND = ds.cierraPedido || null; abrirForm(ds.nuevo, null, ds.pre ? JSON.parse(ds.pre) : null); return; }
  if (ds.portal) {
    const pp = persona(ds.portal), l = linkPortal(pp);
    modal('Portal de ' + esc(String(pp['Nombre completo']).split(' ')[0]),
      `<p class="ayuda" style="margin-top:0">Este es su enlace personal. Podés copiarlo, abrirlo para ver cómo le queda, o mandárselo por WhatsApp.</p><input class="campo" id="lk" readonly value="${esc(l)}">`,
      `<button class="btn-sec" type="button" id="lk-copiar">Copiar</button><a class="btn-sec" href="${esc(l)}" target="_blank" rel="noopener">Abrir</a><button class="btn" type="button" data-msg="${esc(ds.portal)}|portal||">Mandar por WhatsApp</button>`);
    $('lk').onfocus = ev => ev.target.select();
    $('lk-copiar').onclick = () => { $('lk').select(); (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => toast('Enlace copiado')).catch(() => { document.execCommand('copy'); toast('Enlace copiado'); }); };
    return;
  }
  if (ds.pedido) {
    const [fila, est] = ds.pedido.split('|'); const r = H('Pedidos').find(x => String(x._fila) === fila); if (!r) return;
    t.disabled = true;
    try { await guardarCambios('Pedidos', r, { 'Estado': est }, est === 'Atendido' ? 'Pedido atendido ✓' : 'Pedido descartado'); } catch (err) { toast(err.message, true); t.disabled = false; }
    return;
  }
  if (ds.editar) { PEDIDO_PEND = null; const [h, r] = buscarRec(ds.editar); if (r) abrirForm(h, r); return; }
  if (ds.borrar) { const [h, r] = buscarRec(ds.borrar); if (r) borrar(h, r); return; }
  if (ds.msg !== undefined) { const [pid, cl, tid, af] = ds.msg.split('|'); abrirMensaje(pid, ds.plant || cl, tid, af); return; }
  if (ds.foto) { verFoto(ds.foto); return; }
  if (ds.abrir) { CAL.tallerAbierto = CAL.tallerAbierto === ds.abrir ? null : ds.abrir; pintar(); return; }
  if (ds.dia) { CAL.sel = CAL.sel === ds.dia ? null : ds.dia; pintar(); return; }
  if (ds.cal !== undefined) { const n = +ds.cal; if (n === 0) { CAL.y = HOY.getFullYear(); CAL.m = HOY.getMonth(); } else { const d = new Date(CAL.y, CAL.m + n, 1); CAL.y = d.getFullYear(); CAL.m = d.getMonth(); } pintar(); return; }
  if (ds.toggle) {
    const [fila, campo] = ds.toggle.split('|'); const r = H('Asistencias').find(x => String(x._fila) === fila); if (!r) return;
    const nuevo = !si(r[campo]); const datos = { [campo]: nuevo };
    if (campo === 'PDF enviado' && nuevo && !r['Fecha envío PDF']) datos['Fecha envío PDF'] = iso(HOY);
    t.disabled = true;
    try { await guardarCambios('Asistencias', r, datos, nuevo ? 'Marcado ✓' : 'Desmarcado'); } catch (err) { toast(err.message, true); t.disabled = false; }
    return;
  }
  if (ds.reintegro) {
    const lista = ds.reintegro === 'todos' ? H('Gastos').filter(g => g['Pagó'] && !/Devuelto|No corresponde/.test(g['Reintegro'] || '')) : H('Gastos').filter(g => String(g._fila) === ds.reintegro);
    if (!lista.length) return;
    const tot = {}; lista.forEach(g => tot[g['Pagó']] = (tot[g['Pagó']] || 0) + num(g['Total']) / 2);
    const resumen = Object.entries(tot).map(([q, m]) => otraSocia(q) + ' le devolvió ' + pesos(m) + ' a ' + q).join(' y ');
    if (!confirm('¿Registrar que ' + resumen + '?\n\nSe marca como devuelto y queda anotado como transferencia entre ustedes.')) return;
    t.disabled = true;
    try {
      for (let i = 0; i < lista.length; i++) {
        toast('Guardando ' + (i + 1) + ' de ' + lista.length + '…');
        await enviar({ accion: 'editar', hoja: 'Gastos', fila: lista[i]._fila, original: lista[i]['Ítem'], datos: { 'Reintegro': 'Devuelto', 'Fecha reintegro': iso(HOY) } });
      }
      for (const [q, m] of Object.entries(tot)) {
        await enviar({ accion: 'agregar', hoja: 'Transferencias', datos: { 'Fecha': iso(HOY), 'De': otraSocia(q), 'Para': q, 'Monto': Math.round(m), 'Concepto': lista.length === 1 ? 'Reintegro mitad: ' + lista[0]['Ítem'] : 'Reintegro de ' + lista.length + ' compras' } });
      }
      toast('Reintegro registrado ✓'); await cargar(true);
    } catch (err) { toast(err.message, true); t.disabled = false; }
    return;
  }
  if (ds.pdf) {
    const r = H('Asistencias').find(x => String(x._fila) === ds.pdf); if (!r) return;
    t.disabled = true;
    try { await guardarCambios('Asistencias', r, { 'PDF enviado': true, 'Fecha envío PDF': iso(HOY) }, 'PDF marcado como enviado ✓'); } catch (err) { toast(err.message, true); t.disabled = false; }
  }
});

  e.preventDefault(); $('error-ingreso').textContent = '';
  const q = document.querySelector('input[name=quien]:checked');
  if (!q) { $('error-ingreso').textContent = 'Elegí quién sos: Belu o Mey.'; return; }
  QUIEN = q.value; CLAVE = $('clave').value.trim();
  if ($('recordar').checked) { guardarLS(LS_CLAVE, CLAVE); guardarLS(LS_QUIEN, QUIEN); }
  cargar();
});
$('btn-actualizar').addEventListener('click', () => cargar(true).then(() => toast('Datos actualizados')));
$('btn-salir').addEventListener('click', () => { borrarLS(LS_CLAVE); borrarLS(LS_QUIEN); D = null; CLAVE = ''; $('clave').value = ''; mostrar('ingreso'); });

document.querySelectorAll('img[data-logo]').forEach(i => i.src = document.querySelector('link[rel=icon]').href);
CLAVE = leerLS(LS_CLAVE); QUIEN = leerLS(LS_QUIEN);
if (CLAVE && QUIEN) cargar(); else mostrar('ingreso');
</script>
