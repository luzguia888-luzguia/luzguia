<style>
:root{
  --noche:#1C0B2E; --ciruela:#271040; --violeta:#3B1760; --lila:#B98AE6; --lila-suave:#8E6AB3;
  --oro:#D4AF6A; --oro-suave:rgba(212,175,106,.35); --luna:#EDE6F5; --bruma:#B6A7C9; --linea:rgba(185,138,230,.2); --wa:#25D366;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --script:'Great Vibes', 'Segoe Script', 'Brush Script MT', cursive;
  --sans:'Jost', 'Segoe UI', system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--noche);color:var(--luna);font-family:var(--sans);font-size:17px;line-height:1.6;
  background-image:radial-gradient(ellipse 90% 45% at 50% -8%, rgba(185,138,230,.2), transparent 70%);background-attachment:fixed}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px;border-radius:4px}
.oculto{display:none!important}
main{max-width:560px;margin:0 auto;padding:28px 22px 64px}
.marca{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--serif);font-size:1.25rem;font-weight:600;color:var(--bruma)}
.marca img{width:34px;height:34px}
.saludo{text-align:center;margin:30px 0 8px}
.saludo h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,6vw,2rem);line-height:1.05;margin:0;color:var(--bruma)}
.saludo .nombre-script{display:block;font-family:var(--script);font-weight:400;font-size:clamp(3.4rem,15vw,4.6rem);color:var(--luna);line-height:1.15;margin-top:18px}
.saludo p{color:var(--bruma);margin:8px 0 0}
.cumple{margin:22px 0 0;text-align:center;border:1px solid var(--oro);border-radius:14px;padding:16px;color:var(--oro);font-family:var(--serif);font-size:1.35rem}

/* La carta */
.lectura{margin:40px 0 0;text-align:center}
.lectura small{color:var(--bruma);font-size:.95rem}
.carta{width:min(230px,62vw);aspect-ratio:2/3.3;margin:14px auto 0;border:1px solid var(--oro);border-radius:14px;padding:10px;position:relative;
  background:linear-gradient(170deg,var(--violeta),var(--ciruela) 70%);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.carta-in{height:100%;border:1px solid var(--oro-suave);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 10px 18px}
.carta .romano{font-family:var(--serif);font-size:1.6rem;color:var(--oro);letter-spacing:.08em}
.carta .simbolo{width:58%;opacity:.9}
.carta .nombre{font-family:var(--serif);font-size:1.35rem;line-height:1.15}
.lectura .texto{font-family:var(--serif);font-size:1.35rem;line-height:1.45;margin:22px auto 0;max-width:30ch}
.anual{margin:44px 0 0;border-top:1px solid var(--linea);padding-top:30px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.anual .mini{width:74px;aspect-ratio:2/3.3;border:1px solid var(--oro);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.4rem;color:var(--oro);background:var(--violeta)}
.anual small{color:var(--bruma)}
.anual h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0;line-height:1.2}
.anual p{margin:6px 0 0;color:var(--luna)}

function lunaFueraDeCurso(desde, hasta, longLuna, longSolar, longPlaneta, PLANETAS){
  const jd0 = desde.getTime() / 86400000 + 2440587.5, jd1 = hasta.getTime() / 86400000 + 2440587.5;

    if (sig(jd) !== sig(jd + 1/24)) { let a = jd, b = jd + 1/24; for (let i = 0; i < 12; i++) { const m = (a + b) / 2; if (sig(m) === sig(a)) a = m; else b = m; } ingresos.push(b); }

  const dif = (jd) => { const l = longLuna(jd); const cuerpos = [longSolar(jd)].concat(PLANETAS.map(p => longPlaneta(p, jd))); return cuerpos.map(c => asp.map(A => ((l - c - A) % 360 + 540) % 360 - 180)); };

    const tIn = ingresos[i], tPrev = ingresos[i - 1], paso = 1/96;

const sinTildes = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
function reducirNum(n, maestros){ while (n > 9 && !(maestros && (n === 11 || n === 22 || n === 33))) n = String(n).split('').reduce((a, c) => a + +c, 0); return n; }
const VAL_LETRA = l => { const c = l.charCodeAt(0) - 65; return c >= 0 && c < 26 ? (c % 9) + 1 : 0; };
function numerologia(fechaDDMM, anioNac, nombre){
  const out = {};
  if (fechaDDMM && anioNac) {
    const m = fechaDDMM.match(/(\d{2})\/(\d{2})/);
    out.camino = reducirNum((m[1] + m[2] + anioNac).split('').reduce((a, c) => a + +c, 0), true);
    const hoy = new Date(), y = hoy.getFullYear();
    out.anio = reducirNum((m[1] + m[2] + y).split('').reduce((a, c) => a + +c, 0), false);
    out.mes = reducirNum(out.anio + hoy.getMonth() + 1, false);
    out.dia = reducirNum(out.mes + hoy.getDate(), false);
  }
  const letras = sinTildes(nombre || '').replace(/[^A-Z]/g, '');
  if (letras) {
    const suma = f => reducirNum(letras.split('').filter(f).reduce((a, l) => a + VAL_LETRA(l), 0), true);
    out.expresion = suma(() => true);
    out.alma = suma(l => 'AEIOU'.includes(l));
    out.personalidad = suma(l => !'AEIOU'.includes(l));
  }
  return out;
}

function significadoNombre(completo, propio){
  if (propio && propio.trim()) return propio.trim();
  const partes = sinTildes(completo).split(/\s+/).filter(Boolean);
  for (const p of partes) if (NOMBRES[p]) return NOMBRES[p];
  return '';
}

function jsonp(url){
  return new Promise((ok, mal) => {
    const nombre = 'luzguia_cb_' + Date.now();
    const sc = document.createElement('script');
    const fin = () => { delete window[nombre]; sc.remove(); };
    const t = setTimeout(() => { fin(); mal(new Error('sin respuesta')); }, 25000);
    window[nombre] = data => { clearTimeout(t); fin(); ok(data); };
    sc.onerror = () => { clearTimeout(t); fin(); mal(new Error('el script no respondió')); };
    sc.src = url + '&callback=' + nombre;
    document.head.appendChild(sc);
  });
}

function cualidades(){
  const n = numerologia(P.diaMes, P.anioNac, P.nombreCompleto || P.nombre);
  const pts = {}; CUALIDADES.forEach(c => pts[c] = 2);
  const sumar = (num, peso) => { const m = CUAL_NUM[num]; if (m) Object.entries(m).forEach(([c, v]) => pts[c] += v * peso); };
  sumar(n.camino, 1.5); sumar(n.expresion, 1); sumar(n.alma, 1); sumar(n.personalidad, .6);
  if (P.arcano && CUAL_ARC[+P.arcano.n]) CUAL_ARC[+P.arcano.n].split(' ').forEach((c, i) => pts[c] += i ? 2 : 3);
  const max = Math.max(...Object.values(pts));
  const out = CUALIDADES.map(c => ({ c, v: Math.max(3, Math.round(pts[c] / max * 10)) }));
  return out;
}

function chinoDe(diaMes, anio){
  const m = String(diaMes || '').match(/(\d{2})\/(\d{2})/); if (!m || !anio) return null;
  anio = +anio; const nac = new Date(anio, +m[2] - 1, +m[1]);
  const nv = lunas(new Date(anio, 0, 21), new Date(anio, 1, 21)).find(x => !x.llena);
  const y = nv && nac < new Date(nv.fecha.getFullYear(), nv.fecha.getMonth(), nv.fecha.getDate()) ? anio - 1 : anio;
  return { an: CHINO[((y - 1900) % 12 + 12) % 12], el: CHINO_EL[Math.floor(((y % 10) + 10) % 10 / 2)], anio: y };
}

function radarSVG(cs){
  const R = 92, cx = 150, cy = 130, n = cs.length, pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  let s = `<svg class="radar" viewBox="0 0 300 260" role="img" aria-label="Gráfico de tus cualidades">`;
  [.33, .66, 1].forEach(f => s += `<polygon points="${cs.map((x, i) => pt(i, R * f).join(',')).join(' ')}" fill="none" stroke="rgba(185,138,230,.28)"/>`);
  cs.forEach((x, i) => { const [x2, y2] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="rgba(185,138,230,.2)"/>`; });
  s += `<polygon points="${cs.map((x, i) => pt(i, R * x.v / 10).join(',')).join(' ')}" fill="rgba(212,175,106,.35)" stroke="#D4AF6A" stroke-width="2"/>`;
  cs.forEach((x, i) => { const [x2, y2] = pt(i, R * x.v / 10); s += `<circle cx="${x2}" cy="${y2}" r="3" fill="#F3DCA0"/>`; const [lx, ly] = pt(i, R + 22); s += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="11" fill="#E3D6F2" font-family="Jost, sans-serif">${x.c}</text>`; });
  return s + '</svg>';
}

  // Cada mes chino empieza cuando el Sol llega a 315°, 345°, 15°... (términos solares)
  const out = []; let d = new Date(y, 0, 20, 12), prev = longSolar(jdDe(d));
  for (let i = 0; i < 400 && out.length < 13; i++) {
    d = new Date(d.getTime() + 86400000); const l = longSolar(jdDe(d));
    for (let k = 0; k < 13; k++) { const g = (315 + 30 * k) % 360; const pasa = prev < l ? (prev < g && g <= l) : (prev < g || g <= l); if (pasa && out.length === k) out.push(new Date(d)); }

  }
  return out.map((f, k) => ({ desde: f, animal: (2 + k) % 12 }));
}

}

}

const MES_N = { enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12 };

  if ((m = String(x.fecha || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return +m[3] * 12 + (+m[2] - 1);

}

/* Recordatorios en Hoy: mensajes que te dejaste, Luna llena, Luna nueva y portales */
function recordatoriosHTML(){
  if (!P.premium || !P.diario) return '';
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0); const k = isoDia(hoy), out = [];
  const vistos = lsGet('luzguia_rec_vistos', {}) || {};
  (P.diario || []).filter(x => x.tipo === 'Nota' && recordarDe(x) && recordarDe(x) <= k && !vistos[x.luna + recordarDe(x)]).slice(-3).forEach(x => {
    out.push(`<div class="rec-item"><small>📖 Un mensaje de tu diario · ${fechaLinda(x.luna)}</small><p>${esc(x.texto)}</p><div class="fila-bt" style="justify-content:flex-start"><button class="btn-sec" type="button" data-recvisto="${esc(x.luna + recordarDe(x))}">Ya lo leí 💜</button><button class="link" type="button" data-irdiario="${esc(x.luna)}">Ver en la agenda</button></div></div>`);
  });
  let cl = null; try { cl = cicloLunar(); } catch (e) {}
  if (cl && cl.nueva) {
    const int = diarioDe('Intención').find(x => x.luna === cl.k), rev = diarioDe('Revisión').find(x => x.luna === cl.k);
    const esLlena = cl.llena && isoDia(cl.llena.fecha) <= k && (Date.now() - cl.llena.fecha) < 4 * 864e5;
    if (int && esLlena && !rev) out.push(`<div class="rec-item"><small>🌕 Luna llena en ${cl.llena.signo}: ¿cómo va lo que sembraste?</small><p>“${esc(int.texto)}”</p><button class="btn-sec" type="button" data-irdiariolunar>Revisar mis intenciones</button></div>`);
    if (!int && isoDia(cl.nueva.fecha) <= k && (Date.now() - cl.nueva.fecha) < 4 * 864e5) {
      const ant = diarioDe('Intención').filter(x => x.luna !== cl.k).pop();
      out.push(`<div class="rec-item"><small>🌑 Luna nueva en ${cl.nueva.signo}: tiempo de sembrar</small>${ant ? `<p>El ciclo pasado sembraste: “${esc(ant.texto)}”${(() => { const r = diarioDe('Revisión').find(y => y.luna === ant.luna); return r ? ' · ' + esc(r.valor) : ''; })()}</p>` : '<p>Escribí tus intenciones para este ciclo.</p>'}<button class="btn-sec" type="button" data-irdiariolunar>Escribir mis intenciones</button></div>`);
    }
  }
  if (FECHAS_PODER[claveFP(hoy)]) {
    const antes = (P.diario || []).filter(x => x.tipo === 'Nota' && x.luna && x.luna.slice(5) === k.slice(5) && x.luna < k).pop();
    if (antes) out.push(`<div class="rec-item"><small>${FECHAS_PODER[claveFP(hoy)][0]} El ${FECHAS_PODER[claveFP(hoy)][1].replace(/^Portal /, '')} pasado escribiste</small><p>“${esc(antes.texto)}”</p><p class="ag-ayuda" style="margin:0">¿Qué se cumplió desde entonces?</p></div>`);
  }
  return out.length ? `<section class="recordatorios">${out.join('')}</section>` : '';
}
const _hoyRec = hoyHTML;
hoyHTML = function(){
  let h = _hoyRec(); let r = ''; try { r = recordatoriosHTML(); } catch (e) { console.error(e); }
  if (!r) return h;
  const i = h.indexOf('<section class="poder'), j = h.indexOf('<section class="clima">'), at = i > -1 ? h.indexOf('</section>', i) + 10 : j;

};

function irDiarioDia(k){
  const m = String(k).match(/(\d{4})-(\d{2})-(\d{2})/); if (!m) return;
  AG.y = +m[1]; AG.m = +m[2] - 1; AG.sel = +m[3]; irTab('agenda'); pintarAgenda();
  setTimeout(() => { const el = $('ag-diario'); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); const t = $('ag-nota'); if (t) t.focus({ preventScroll: true }); } }, 250);
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.irdiario) { irDiarioDia(b.dataset.irdiario); return; }
  if (b.dataset.irdiariolunar !== undefined) { PREM_ABIERTA = 'diario'; irTab('premium'); repintarPrem(); setTimeout(() => { const el = document.querySelector('details[data-premsec=diario]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200); return; }
  if (b.dataset.recvisto) { const v = lsGet('luzguia_rec_vistos', {}) || {}; v[b.dataset.recvisto] = 1; lsSet('luzguia_rec_vistos', v); const it = b.closest('.rec-item'); if (it) it.remove(); return; }
  if (b.dataset.agnota) {
    const k = b.dataset.agnota, texto = ($('ag-nota').value || '').trim(), rec = $('ag-rec').value;
    if (!texto) { $('ag-nota').focus(); return; }
    const valor = rec ? 'recordar ' + rec : '';
    b.disabled = true; b.textContent = 'Guardando…';
    P.diario = (P.diario || []).filter(x => !(x.tipo === 'Nota' && x.luna === k)); P.diario.push({ f: new Date().toISOString(), tipo: 'Nota', luna: k, texto, valor });
    try { await fetch(API, { method: 'POST', body: JSON.stringify({ accion: 'diario', codigo: CODIGO, tipo: 'Nota', luna: k, texto, valor }) }); } catch (x) {}
    evento('Sección', 'Diario: nota en la agenda' + (rec ? ' con recordatorio' : ''));
    const s = RACHA || estadoRacha(); RACHA = s; setTimeout(() => revisarLogros(), 600);
    pintarAgenda(); setTimeout(() => { const el = $('ag-diario'); if (el) el.scrollIntoView({ block: 'center' }); }, 50);
    return;
  }
});

/* 3) Hoy ordenado: primeros pasos → día de poder → "Para vos hoy" (máx. 2) → tu energía → tu tirada → tu calma → "Más para hoy" */
function reordenarHoy(h){
  const box = document.createElement('div'); box.innerHTML = h;
  const B = { racha: [], poder: [], para: [], clima: [], mensaje: [], tirada: [], calma: [], mas: [], resto: [] };
  let grupo = 'resto';
  const H3 = t => /mensaje del día/i.test(t) ? 'mensaje' : /carta del día/i.test(t) ? 'tirada' : /calma/i.test(t) ? 'calma' : /tiradas para hoy|ritual de hoy/i.test(t) ? 'mas' : 'resto';
  [...box.children].forEach(el => {
    const c = el.classList;
    if (el.tagName === 'H3') { grupo = H3(el.textContent); B[grupo].push(el); return; }
    if (c.contains('racha')) return B.racha.push(el);
    if (c.contains('poder') && !c.contains('pronto')) return B.poder.push(el);
    if (c.contains('poder') || c.contains('conf-datos') || c.contains('pase-hoy') || c.contains('am-banner') || c.contains('avisos-caja') || c.contains('juego')) return B.para.push(el);
    if (c.contains('recordatorios')) { [...el.children].forEach(x => B.para.push(x)); return; }
    if (c.contains('clima')) return B.clima.push(el);
    if (c.contains('afin-inv') || c.contains('invitar') || c.contains('instalar') || c.contains('prem-gratis')) return B.mas.push(el);
    B[grupo === 'resto' ? 'resto' : grupo].push(el);
  });
  const hayPasos = !ux.ls('luzguia_pasos_ok', 0), dias = diasDesdeInicio();
  // pedidos escalonados: avisos desde el 2.º día (y con los pasos listos); invitar y afinidad desde el 5.º
  B.para = B.para.filter(el => !(hayPasos && el.classList.contains('conf-datos')) && !(el.classList.contains('avisos-caja') && (hayPasos || dias < 1)));
  B.mas = B.mas.filter(el => !((el.classList.contains('afin-inv') || el.classList.contains('invitar')) && dias < 4) && !(el.classList.contains('instalar') && hayPasos));
  let out = B.racha.map(x => x.outerHTML).join('');
  try { out += primerosPasosHTML(); } catch (e) { console.error(e); }
  out += B.poder.map(x => x.outerHTML).join('');
  if (B.para.length) {
    const vis = B.para.slice(0, 2), ocu = B.para.slice(2);
    out += `<section class="para-vos"><h3>Para vos hoy</h3>${vis.map(x => x.outerHTML).join('')}${ocu.length ? `<details class="para-mas"><summary>Ver ${ocu.length} más</summary>${ocu.map(x => x.outerHTML).join('')}</details>` : ''}</section>`;
  }
  if (B.clima.length) {
    let cl = B.clima[0].outerHTML.replace(/<small>Tarot<\/small>/, '<small>Arcano del día</small>');
    const msg = B.mensaje.filter(x => x.tagName !== 'H3').map(x => x.outerHTML).join('');
    if (msg) { const k = cl.lastIndexOf('</section>'); cl = cl.slice(0, k) + `<details class="mas clima-msg"><summary>Leer tu mensaje completo <span aria-hidden="true">✦</span></summary><div>${msg}</div></details>` + cl.slice(k); }
    out += '<h3>Tu energía de hoy</h3>' + cl;
  } else out += B.mensaje.map(x => x.outerHTML).join('');
  if (B.tirada.length) out += '<h3>Tu tirada de hoy</h3>' + B.tirada.filter(x => x.tagName !== 'H3').map(x => x.outerHTML).join('');
  out += B.calma.map(x => x.outerHTML).join('');
  out += B.resto.map(x => x.outerHTML).join('');
  const mas = B.mas.map(x => x.tagName === 'H3' ? `<h4 class="mas-h">${x.textContent}</h4>` : x.outerHTML).join('');
  if (mas) out += `<details class="mas-hoy"${ux.ls('luzguia_mas_abierto', 0) ? ' open' : ''}><summary><span>✦ Más para hoy</span><small>Tiradas temáticas, ritual del día y más</small></summary><div>${mas}</div></details>`;
  return out;
}
