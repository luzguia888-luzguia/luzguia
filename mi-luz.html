<style>
:root{
  --noche:#1C0B2E; --ciruela:#271040; --violeta:#3B1760; --lila:#B98AE6; --lila-suave:#8E6AB3;
  --oro:#D4AF6A; --oro-suave:rgba(212,175,106,.35); --luna:#EDE6F5; --bruma:#B6A7C9; --linea:rgba(185,138,230,.2); --wa:#25D366;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --script:'Great Vibes', 'Segoe Script', 'Brush Script MT', cursive;
  --sans:'Jost', 'Segoe UI', system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--noche);color:var(--luna);font-family:var(--sans);font-size:17px;line-height:1.6;
  background-image:radial-gradient(ellipse 90% 45% at 50% -8%, rgba(185,138,230,.2), transparent 70%);background-attachment:fixed}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px;border-radius:4px}
.oculto{display:none!important}
main{max-width:560px;margin:0 auto;padding:28px 22px 64px}
.marca{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--serif);font-size:1.25rem;font-weight:600;color:var(--bruma)}
.marca img{width:34px;height:34px}
.saludo{text-align:center;margin:30px 0 8px}
.saludo h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,6vw,2rem);line-height:1.05;margin:0;color:var(--bruma)}
.saludo .nombre-script{display:block;font-family:var(--script);font-weight:400;font-size:clamp(3.4rem,15vw,4.6rem);color:var(--luna);line-height:1.1;margin-top:2px}
.saludo p{color:var(--bruma);margin:8px 0 0}
.cumple{margin:22px 0 0;text-align:center;border:1px solid var(--oro);border-radius:14px;padding:16px;color:var(--oro);font-family:var(--serif);font-size:1.35rem}

/* La carta */
.lectura{margin:40px 0 0;text-align:center}
.lectura small{color:var(--bruma);font-size:.95rem}
.carta{width:min(230px,62vw);aspect-ratio:2/3.3;margin:14px auto 0;border:1px solid var(--oro);border-radius:14px;padding:10px;position:relative;
  background:linear-gradient(170deg,var(--violeta),var(--ciruela) 70%);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.carta-in{height:100%;border:1px solid var(--oro-suave);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 10px 18px}
.carta .romano{font-family:var(--serif);font-size:1.6rem;color:var(--oro);letter-spacing:.08em}
.carta .simbolo{width:58%;opacity:.9}
.carta .nombre{font-family:var(--serif);font-size:1.35rem;line-height:1.15}
.lectura .texto{font-family:var(--serif);font-size:1.35rem;line-height:1.45;margin:22px auto 0;max-width:30ch}
.anual{margin:44px 0 0;border-top:1px solid var(--linea);padding-top:30px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.anual .mini{width:74px;aspect-ratio:2/3.3;border:1px solid var(--oro);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.4rem;color:var(--oro);background:var(--violeta)}
.anual small{color:var(--bruma)}
.anual h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0;line-height:1.2}
.anual p{margin:6px 0 0;color:var(--luna)}

h3{font-family:var(--serif);font-weight:600;font-size:1.6rem;margin:48px 0 14px;color:var(--lila)}
.encuentro{border:1px solid var(--linea);border-radius:14px;background:var(--ciruela);padding:18px 18px 16px;margin-bottom:12px}

  });
}

async function cargar(){
  if (!CODIGO) return error('Este enlace está incompleto. Pedile el tuyo a Luz Guía.');
  let d, detalle = '';
  try {
    const r = await fetch(API + '?accion=portal&codigo=' + encodeURIComponent(CODIGO));
    const txt = await r.text();
    try { d = JSON.parse(txt); } catch (x) { detalle = 'respuesta no válida'; }
  } catch (e) { detalle = String(e.message || e); }
  // Si el primer camino falla, probamos el segundo (JSONP)
  if (!d) {
    try { d = await jsonp(API + '?accion=portal&codigo=' + encodeURIComponent(CODIGO)); }
    catch (e) { console.error(detalle, e); return error('No pudimos conectar con Luz Guía (' + detalle + ' / ' + (e.message || e) + '). Avisales a Belu o Mey.'); }
  }
  try {
    if (!d.ok) return error(d.error === 'Enlace no válido' ? 'Este enlace no es válido. Pedile el tuyo a Luz Guía.' : 'No pudimos abrir tu espacio (' + (d.error || 'error desconocido') + ').');
    P = d; P.arcano = completar(P.arcano); P.anual = completar(P.anual); P.encuentros = P.encuentros || []; P.productos = P.productos || []; P.pedidos = P.pedidos || []; P.promos = P.promos || []; P.paraOpinar = P.paraOpinar || [];
    pintar(); pintarAgenda(); setTimeout(auto, 50);
    $('estado').classList.add('oculto'); $('portal').classList.remove('oculto');
  } catch (e) { console.error(e); error('Hubo un problema al mostrar tu espacio (' + (e.message || e) + '). Avisales a Belu o Mey.'); }
}

function pintar(){
  const logo = document.querySelector('link[rel=icon]').href;
  let h = `<div class="marca"><img src="${logo}" alt="">Luz Guía</div>`;
  h += `<section class="saludo">${deco('luna', 'deco-luna')}<h1>Hola,<span class="nombre-script">${esc(P.nombre)}</span></h1><p>Este es tu espacio personal en Luz Guía.</p></section>`;
  const dc = diasDesdeCumple();
  if (dc !== null && dc <= 7) {
    h += `<section class="cumple-caja">${deco('vela', 'deco-vela')}${deco('luna', 'deco-luna-c')}
      <small>${dc === 0 ? 'Hoy es tu día' : 'Tu nuevo ciclo empezó hace ' + dc + (dc === 1 ? ' día' : ' días')}</small>
      <h2>¡Feliz cumpleaños, ${esc(P.nombre)}! 🎂</h2>
      <p>Empieza una nueva vuelta al sol, y en Luz Guía queremos acompañarte con un mensaje para este ciclo.</p>
      ${P.arcano ? `<p>Tu arcano de nacimiento, <b>${esc(P.arcano.nombre)}</b>, te recuerda tu esencia: ${esc(String(P.arcano.texto || '').charAt(0).toLowerCase() + String(P.arcano.texto || '').slice(1))}</p>` : ''}
      ${P.anual ? `<p>Y este año te acompaña <b>${esc(P.anual.nombre)}</b>: ${esc(String(P.anual.texto || '').charAt(0).toLowerCase() + String(P.anual.texto || '').slice(1))}</p>` : ''}
      <div class="ritual"><b>Un pequeño ritual para tu cumpleaños</b><p>Encendé una vela y escribí tres cosas que querés soltar y tres que querés invitar a tu vida. Leelas en voz alta, apagá la vela con gratitud y guardá el papel hasta tu próximo cumpleaños.</p></div>
      <p class="firma">Con cariño, Belu y Mey 💜</p></section>`;
  }

  if (P.arcano && P.arcano.nombre) {
    h += `<section class="lectura">${constelacion('izq')}${constelacion('der')}<small>Tu arcano de nacimiento</small>
      <div class="carta con-img" role="img" aria-label="Carta ${esc(P.arcano.nombre)}"><img class="carta-foto" src="${cartaSrc(P.arcano.n)}" alt="" onerror="this.parentNode.classList.remove('con-img'); this.remove()"><div class="carta-in"><span class="romano">${romano(P.arcano.n)}</span><img class="simbolo" src="${logo}" alt=""><span class="nombre">${esc(P.arcano.nombre)}</span></div></div>
      <p class="texto">${esc(P.arcano.texto)}</p></section>`;
  } else {
    h += `<section class="lectura"><p class="texto">Todavía no tenemos tu fecha de nacimiento. Pasánosla y te calculamos tu arcano.</p></section>`;
  }
  if (P.anual && P.anual.nombre) {
    h += `<section class="anual"><div class="mini con-img" aria-hidden="true"><img src="${cartaSrc(P.anual.n)}" alt="" onerror="this.parentNode.classList.remove('con-img'); this.remove()"><span>${romano(P.anual.n)}</span></div><div><small>La energía de tu ${esc(P.anio)}</small><h2>${esc(P.anual.nombre)}</h2><p>${esc(P.anual.texto)}</p></div></section>`;
  }

  const anio = +P.anio || new Date().getFullYear();
  if (P.diaMes) {
    const ant = arcanoDeAnio(P.diaMes, anio - 1), sig = arcanoDeAnio(P.diaMes, anio + 1), u = anioUniversal(anio);
    h += `<h3>Tu ciclo</h3><div class="ciclo">
      <div><small>De dónde venís · ${anio - 1}</small><b>${romano(ant)}</b><span>${esc(NOM[ant])}</span></div>
      <div><small>Hoy transitás · ${anio}</small><b>${P.anual ? romano(P.anual.n) : '—'}</b><span>${P.anual ? esc(P.anual.nombre) : ''}</span></div>
      <div><small>Hacia dónde vas · ${anio + 1}</small><b>${romano(sig)}</b><span>${esc(NOM[sig])}</span></div></div>
      <p class="ciclo-txt">${anio} es un año universal ${u}. Tu arcano de nacimiento es la raíz; el del año es la estación que estás atravesando.</p>
      <div class="deco-centro"><div class="cristal-brillo">${deco('cristales', 'deco-cristales')}<i></i><i></i><i></i></div></div>`;
  }

  const lu = proximaLuna();
  if (lu) {
    const g = SIGNOS[lu.signo], f = new Date(lu.fecha), esHoy = f.toDateString() === new Date().toDateString();
    h += `<h3>La luna de estos días</h3><div class="luna-caja"><div class="luna-dibujo${lu.llena ? ' llena' : ''}" aria-hidden="true"></div><div>
      <small>${esHoy ? 'Hoy' : DIAS[f.getDay()] + ' ' + f.getDate() + ' de ' + MESES[f.getMonth()]}</small>
      <h4>${lu.llena ? 'Luna llena' : 'Luna nueva'} en ${lu.signo}</h4>
      <p>${lu.llena ? 'Ilumina ' + g.area + ': tiempo de culminar, ver con claridad y soltar lo que ya no suma.' : 'Abre un nuevo ciclo en ' + g.area + ': tiempo de sembrar intenciones y empezar.'}</p>
      <p><b>Buen momento para:</b> ${g.fav.join(', ')}.<br><b>Cuidado con:</b> ${g.ojo}.</p></div></div>`;
  }
  h += seccionAgenda();
  SLIDES = armarSlides();
  if (SLIDES.length) {
    h += `<h3>Novedades</h3><div class="carrusel" id="carrusel" aria-roledescription="carrusel">${SLIDES.map((x, i) => `
      <article class="slide${i === 0 ? ' activa' : ''}" aria-label="${i + 1} de ${SLIDES.length}">
        <div class="arte">${x.imagen ? `<img src="${esc(x.imagen)}" alt="" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(artePara('${esc(x.tipo)}', ${i}, '${esc(x.titulo).replace(/'/g, '')}')))">` : artePara(x.tipo, i, x.titulo)}${chispas(7)}</div>
        <div class="cuerpo"><h4>${esc(x.titulo)}</h4><p>${esc(x.frase)}</p>
        <button class="btn" type="button" data-promo="${i}">${esc(x.boton || (x.tipo === 'Nuevas fechas' ? 'Ver fechas' : 'Quiero saber más'))}</button></div></article>`).join('')}
      ${SLIDES.length > 1 ? `<div class="puntos">${SLIDES.map((x, i) => `<button type="button" data-ir="${i}" aria-label="Novedad ${i + 1}"${i === 0 ? ' aria-current="true"' : ''}></button>`).join('')}</div>` : ''}</div>`;
  }

  h += '<h3 id="encuentros">Próximos encuentros</h3>';
  h += P.encuentros.length ? P.encuentros.map(t => {
    const pedido = P.pedidos.includes(t.id);
    const accion = t.inscripta ? '<span class="hecho">✓ Ya tenés tu lugar</span>'
      : pedido ? '<span class="hecho">Pedido enviado. Te escribimos pronto ✨</span>'
      : `<button class="btn" type="button" data-encuentro="${esc(t.id)}">Quiero mi lugar</button>`;
    return `<article class="encuentro"><h4>${esc(t.nombre)}</h4><div class="cuando">${esc(cuando(t.fecha))}${t.hora ? ', ' + esc(t.hora) + ' h' : ''}</div>
      <div class="datos">${esc(t.formato)}${t.precio ? ' · ' + esc(t.precio) : ''}${!t.inscripta ? ' · ' + (t.lugares === 1 ? 'queda 1 lugar' : 'quedan ' + t.lugares + ' lugares') : ''}</div>${accion}</article>`;
  }).join('') : '<p class="vacio">Pronto anunciamos nuevos encuentros. Te avisamos 🌙</p>';

  if (P.testimonios && P.testimonios.length) {
    h += '<h3>Lo que se vive en los encuentros</h3><div class="testis">' + P.testimonios.map(t => `<figure class="testi"><div class="estrellas-f">${'★'.repeat(t.puntaje || 5)}</div><blockquote>“${esc(t.texto)}”</blockquote><figcaption>${esc(t.nombre)} · ${esc(t.encuentro)}</figcaption></figure>`).join('') + '</div>';
  }
  if (P.paraOpinar && P.paraOpinar.length) {
    h += '<h3 class="con-deco">Contanos cómo te fue ' + deco('vela', 'deco-vela-h') + '</h3>';
    h += P.paraOpinar.map(t => `<div class="opinar" data-opinar="${esc(t.id)}"><h4>${esc(t.nombre)}</h4><small style="color:var(--bruma)">${esc(cuando(t.fecha))}</small>
      <div class="estrellas" role="radiogroup" aria-label="Puntaje">${[1,2,3,4,5].map(n => `<button type="button" class="on" data-estrella="${n}" role="radio" aria-checked="${n === 5}" aria-label="${n} estrellas">★</button>`).join('')}</div>
      <label for="op-${esc(t.id)}" style="display:block;color:var(--bruma);font-size:.92rem;margin-bottom:6px">¿Qué te llevaste de este encuentro?</label><textarea id="op-${esc(t.id)}" maxlength="800"></textarea>
      <label for="px-${esc(t.id)}" style="display:block;color:var(--bruma);font-size:.92rem;margin:12px 0 6px">¿Qué te gustaría vivir en un próximo encuentro? (opcional)</label><textarea id="px-${esc(t.id)}" class="proximo" maxlength="400" style="min-height:60px"></textarea>
      <label class="check"><input type="checkbox" checked> Pueden compartir mi opinión en sus redes, solo con mi nombre de pila.</label>
      <button class="btn" type="button" data-enviar-op="${esc(t.id)}">Enviar</button></div>`).join('');
  }

  if (P.productos.length) {
    h += '<h3 id="productos">Para llevarte</h3><div>';
    h += P.productos.map(x => {
      const pedido = P.pedidos.includes(x.nombre);
      return `<div class="producto"><div>${esc(x.nombre)}<small>${esc(x.categoria || '')}${x.categoria ? ' · ' : ''}${esc(x.precio)}</small></div>${pedido ? '<span class="hecho">Pedido ✓</span>' : `<button class="btn-sec" type="button" data-producto="${esc(x.nombre)}">Me interesa</button>`}</div>`;
    }).join('') + '</div>';
  }

  const estandar = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!estandar) {
    h += `<div class="instalar"><h4>📲 Llevá Mi Luz en tu celular</h4><p>Todos los días tiene algo nuevo para vos: tu energía, la luna y tu agenda. Instalala como app y abrila con un toque desde tu pantalla de inicio.</p><button class="btn" type="button" id="btn-instalar">Instalar Mi Luz</button></div>`;
  }
  if (P.telLuz || P.instagram) h += `<div class="contacto"><p>¿Tenés alguna pregunta? Escribinos o seguinos para enterarte de todo.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    ${P.telLuz ? `<a class="wa" href="${waLuz('Hola! Soy ' + P.nombre + ', les escribo desde mi espacio de Luz Guía 🌙')}" target="_blank" rel="noopener">${WA_SVG} Escribinos</a>` : ''}
    ${P.instagram ? `<a class="ig" href="${esc(P.instagram)}" target="_blank" rel="noopener">${IG_SVG} @${esc((P.instagram.match(/instagram\.com\/([^/?#]+)/) || [,'luzguia'])[1])}</a>` : ''}</div></div>`;
  h += '<footer>Belu y Mey · Luz Guía</footer>';
  $('portal').innerHTML = h;
}

function pedir(tipo, ref, que){
  $('dlg-titulo').textContent = tipo === 'Encuentro' ? 'Reservar tu lugar' : 'Me interesa';
  $('dlg-texto').textContent = que + '. Si querés, dejanos un mensaje.';
  $('dlg-cuerpo').innerHTML = `<label for="dlg-msg" class="oculto">Mensaje</label><textarea id="dlg-msg" maxlength="500" placeholder="Opcional"></textarea>
    <div class="fila-bt"><button class="btn-sec" type="button" id="dlg-cancelar">Cancelar</button><button class="btn" type="button" id="dlg-enviar">Enviar pedido</button></div>`;
  $('dlg').showModal();
  $('dlg-cancelar').onclick = () => $('dlg').close();
  $('dlg-enviar').onclick = async ev => {
    const b = ev.target; b.disabled = true; b.textContent = 'Enviando…';
    const mensaje = $('dlg-msg').value.trim();
    try {
      const r = await fetch(API, { method: 'POST', body: JSON.stringify({ accion: 'pedido', codigo: CODIGO, tipo, ref, que, mensaje }) });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error);
      P.pedidos.push(ref); pintar(); pintarAgenda();
      const wa = waLuz('Hola! Soy ' + P.nombre + '. Acabo de pedir desde mi espacio: ' + que + (mensaje ? '. ' + mensaje : '') + ' 🌙');
      $('dlg-titulo').textContent = '¡Listo! ✨';
      $('dlg-texto').textContent = 'Belu y Mey ya recibieron tu pedido y te van a escribir para confirmarlo.';
      const ig = usuarioIG();
      $('dlg-texto').textContent = 'Belu y Mey ya recibieron tu pedido y te van a escribir para confirmarlo. Si querés, avisales también por donde prefieras:';
      $('dlg-cuerpo').innerHTML = `<div class="fila-bt" style="justify-content:center">${wa ? `<a class="wa" href="${wa}" target="_blank" rel="noopener">${WA_SVG} WhatsApp</a>` : ''}${ig ? `<button class="ig" type="button" id="dlg-ig">${IG_SVG} Instagram</button>` : ''}</div>
        <p class="ayuda-ig oculto" id="dlg-ig-ok">Copiamos tu mensaje: pegalo en el chat de Instagram que se acaba de abrir ✨</p>
        <div class="fila-bt"><button class="btn-sec" type="button" id="dlg-ok">Cerrar</button></div>`;
      if (ig) $('dlg-ig').onclick = async () => {
        const texto = 'Hola! Soy ' + P.nombre + '. Pedí desde mi espacio de Luz Guía: ' + que + (mensaje ? '. ' + mensaje : '') + ' 🌙';
        try { await navigator.clipboard.writeText(texto); } catch (e) {}
        $('dlg-ig-ok').classList.remove('oculto');
        window.open('https://ig.me/m/' + ig, '_blank', 'noopener');
      };
      $('dlg-ok').onclick = () => $('dlg').close();
    } catch (e) {
      b.disabled = false; b.textContent = 'Enviar pedido';
      $('dlg-texto').textContent = 'No se pudo enviar el pedido. Probá de nuevo en un momento.';
    }
  };
}

let SL = 0, TIMER = null;
function irA(i){
  const c = $('carrusel'); if (!c) return;
  const sl = c.querySelectorAll('.slide'); if (!sl.length) return;
  SL = (i + sl.length) % sl.length;
  sl.forEach((x, k) => x.classList.toggle('activa', k === SL));
  c.querySelectorAll('.puntos button').forEach((x, k) => x.setAttribute('aria-current', k === SL ? 'true' : 'false'));
}
function auto(){ clearInterval(TIMER); if (SLIDES.length > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches) TIMER = setInterval(() => irA(SL + 1), 6500); }
let tx = null;
document.addEventListener('touchstart', e => { if (e.target.closest('#carrusel')) tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => { if (tx === null) return; const d = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(d) > 40) { irA(SL + (d < 0 ? 1 : -1)); auto(); } });

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ir !== undefined) { irA(+b.dataset.ir); auto(); return; }
  if (b.id === 'btn-instalar') {
    if (INSTALAR) { INSTALAR.prompt(); INSTALAR.userChoice.then(r => { if (r.outcome === 'accepted') b.closest('.instalar').remove(); }); INSTALAR = null; return; }
    guiaInstalar(); return;
  }
  if (b.id === 'btn-compartir') { compartirEnergia(b); return; }
  if (b.dataset.agcat) { AG.cat = b.dataset.agcat; pintarAgenda(); return; }
  if (b.dataset.agics) { descargarICS(b.dataset.agics); return; }
  if (b.dataset.agdia) { AG.sel = AG.sel === +b.dataset.agdia ? null : +b.dataset.agdia; pintarAgenda(); return; }
  if (b.dataset.agmes) { const d = new Date(AG.y, AG.m + +b.dataset.agmes, 1); AG.y = d.getFullYear(); AG.m = d.getMonth(); const hoy = new Date(); AG.sel = (AG.y === hoy.getFullYear() && AG.m === hoy.getMonth()) ? hoy.getDate() : null; pintarAgenda(); return; }
  if (b.dataset.promo !== undefined) {
    const x = SLIDES[+b.dataset.promo];
    if (x.accion === 'fechas') { $('encuentros').scrollIntoView({ behavior: 'smooth' }); return; }
    if (x.accion === 'productos') { $('productos').scrollIntoView({ behavior: 'smooth' }); return; }
    if (x.accion === 'reservar') { const en = P.encuentros.find(e => e.id === x.ref); pedir('Encuentro', en.id, en.nombre + ' (' + cuando(en.fecha) + ')'); return; }
    if (x.accion === 'producto') { pedir('Producto', x.ref, x.ref); return; }
    if (x.accion === 'link') { window.open(x.ref, '_blank', 'noopener'); return; }
    pedir('Promoción', x.titulo, x.titulo); return;
  }
  if (b.dataset.estrella) {
    const n = +b.dataset.estrella;
    b.parentNode.querySelectorAll('button').forEach(s2 => { const v = +s2.dataset.estrella; s2.classList.toggle('on', v <= n); s2.setAttribute('aria-checked', v === n); });
    b.parentNode.dataset.valor = n; return;
  }
  if (b.dataset.enviarOp) {
    const caja = b.closest('.opinar');
    const puntaje = +(caja.querySelector('.estrellas').dataset.valor || 5);
    b.disabled = true; b.textContent = 'Enviando…';
    try {
      const r = await fetch(API, { method: 'POST', body: JSON.stringify({ accion: 'testimonio', codigo: CODIGO, encuentro: b.dataset.enviarOp, puntaje, comentario: caja.querySelector('textarea').value.trim(), proximo: caja.querySelector('textarea.proximo').value.trim(), publicar: caja.querySelector('input[type=checkbox]').checked }) });
      const d = await r.json(); if (!d.ok) throw new Error(d.error);
      caja.innerHTML = '<h4>¡Gracias por contarnos! 💜</h4><p style="color:var(--bruma);margin:0">Tu opinión nos ayuda a seguir creando encuentros con sentido.</p>';
    } catch (err) { b.disabled = false; b.textContent = 'Probar de nuevo'; }
    return;
  }
  if (b.dataset.encuentro) { const t = P.encuentros.find(x => x.id === b.dataset.encuentro); pedir('Encuentro', t.id, t.nombre + ' (' + cuando(t.fecha) + ')'); }
  if (b.dataset.producto) pedir('Producto', b.dataset.producto, b.dataset.producto);
});
(function cielo(){
  const sombras = (n, maxTam) => Array.from({ length: n }, () => {
    const x = (Math.random() * 100).toFixed(2) + 'vw', y = (Math.random() * 100).toFixed(2) + 'vh';
    const c = Math.random() < .25 ? '#f3dca0' : Math.random() < .5 ? '#e9dcff' : '#ffffff';
    return x + ' ' + y + ' ' + (Math.random() * maxTam).toFixed(1) + 'px ' + c;
  }).join(',');
  document.querySelector('.lejos').style.setProperty('--sombras', sombras(160, .6));
  document.querySelector('.cerca').style.setProperty('--sombras', sombras(45, 1.2));
  const polvo = document.querySelector('.polvo');
  for (let i = 0; i < 14; i++) { const p = document.createElement('span'); p.style.left = (Math.random() * 100) + 'vw'; p.style.animationDuration = (14 + Math.random() * 16) + 's'; p.style.animationDelay = (-Math.random() * 30) + 's'; polvo.appendChild(p); }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const lanzar = () => {
    const f = document.createElement('div'); f.className = 'fugaz';
    f.style.left = (50 + Math.random() * 50) + 'vw'; f.style.top = (Math.random() * 45) + 'vh';
    document.getElementById('cielo').appendChild(f); setTimeout(() => f.remove(), 1500);
    setTimeout(lanzar, 7000 + Math.random() * 9000);
  };
  setTimeout(lanzar, 2500);
})();
document.querySelectorAll('img[data-logo]').forEach(i => i.src = document.querySelector('link[rel=icon]').href);
cargar();
