<style>
:root{
  --noche:#1C0B2E; --ciruela:#271040; --violeta:#3B1760; --lila:#B98AE6; --lila-suave:#8E6AB3;
  --oro:#D4AF6A; --oro-suave:rgba(212,175,106,.35); --luna:#EDE6F5; --bruma:#B6A7C9; --linea:rgba(185,138,230,.2); --wa:#25D366;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --script:'Great Vibes', 'Segoe Script', 'Brush Script MT', cursive;
  --sans:'Jost', 'Segoe UI', system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--noche);color:var(--luna);font-family:var(--sans);font-size:17px;line-height:1.6;
  background-image:radial-gradient(ellipse 90% 45% at 50% -8%, rgba(185,138,230,.2), transparent 70%);background-attachment:fixed}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px;border-radius:4px}
.oculto{display:none!important}
main{max-width:560px;margin:0 auto;padding:28px 22px 64px}
.marca{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--serif);font-size:1.25rem;font-weight:600;color:var(--bruma)}
.marca img{width:34px;height:34px}
.saludo{text-align:center;margin:30px 0 8px}
.saludo h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,6vw,2rem);line-height:1.05;margin:0;color:var(--bruma)}
.saludo .nombre-script{display:block;font-family:var(--script);font-weight:400;font-size:clamp(3.4rem,15vw,4.6rem);color:var(--luna);line-height:1.15;margin-top:18px}
.saludo p{color:var(--bruma);margin:8px 0 0}
.cumple{margin:22px 0 0;text-align:center;border:1px solid var(--oro);border-radius:14px;padding:16px;color:var(--oro);font-family:var(--serif);font-size:1.35rem}

/* La carta */
.lectura{margin:40px 0 0;text-align:center}
.lectura small{color:var(--bruma);font-size:.95rem}
.carta{width:min(230px,62vw);aspect-ratio:2/3.3;margin:14px auto 0;border:1px solid var(--oro);border-radius:14px;padding:10px;position:relative;
  background:linear-gradient(170deg,var(--violeta),var(--ciruela) 70%);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.carta-in{height:100%;border:1px solid var(--oro-suave);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 10px 18px}
.carta .romano{font-family:var(--serif);font-size:1.6rem;color:var(--oro);letter-spacing:.08em}
.carta .simbolo{width:58%;opacity:.9}
.carta .nombre{font-family:var(--serif);font-size:1.35rem;line-height:1.15}
.lectura .texto{font-family:var(--serif);font-size:1.35rem;line-height:1.45;margin:22px auto 0;max-width:30ch}
.anual{margin:44px 0 0;border-top:1px solid var(--linea);padding-top:30px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.anual .mini{width:74px;aspect-ratio:2/3.3;border:1px solid var(--oro);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.4rem;color:var(--oro);background:var(--violeta)}
.anual small{color:var(--bruma)}
.anual h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0;line-height:1.2}
.anual p{margin:6px 0 0;color:var(--luna)}

.tag-agotado{position:absolute;top:8px;left:8px;background:rgba(10,4,18,.85);color:var(--bruma);border:1px solid var(--lila-suave);border-radius:99px;padding:2px 10px;font-size:.78rem}
.prod.agotado .prod-img{filter:grayscale(.6) brightness(.7)}
.prod-txt{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod-txt h4{margin:0;font-size:1rem;font-weight:500}

.comp{font-size:.85rem;margin-top:8px}
.tirada .comp{margin-top:4px}
footer{text-align:center;color:var(--lila-suave);font-size:.85rem;margin-top:48px}

dialog{border:1px solid var(--linea);border-radius:16px;background:var(--ciruela);color:var(--luna);padding:22px;width:min(460px,92vw)}

dialog p{color:var(--bruma);margin:0 0 14px}
dialog textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--lila-suave);background:var(--noche);padding:10px 12px;resize:vertical}
.fila-bt{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
#estado{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--bruma);font-family:var(--serif);font-size:1.4rem;font-style:italic;padding:24px}
#estado img{width:84px;height:84px;margin-bottom:16px}

  const out = [], a = desde.getFullYear() + desde.getMonth()/12;

    for (const llena of [false, true]) {

const R2 = Math.PI / 180;

  const T = (jd - 2451545) / 36525;

  const Mp = (134.9633964 + 477198.8675055*T)*R2, F = (93.2720950 + 483202.0175233*T)*R2, s = Math.sin;
  return norm(L + 6.289*s(Mp) + 1.274*s(2*D - Mp) + 0.658*s(2*D) + 0.214*s(2*Mp) - 0.186*s(M) - 0.114*s(2*F)
    + 0.059*s(2*D - 2*Mp) + 0.057*s(2*D - M - Mp) + 0.053*s(2*D + Mp) + 0.046*s(2*D - M) + 0.041*s(Mp - M) - 0.035*s(D) - 0.030*s(Mp + M));
}
function longSolar(jd){
  const T = (jd - 2451545) / 36525, M = (357.52911 + 35999.05029*T)*R2;

  const M = norm(L - w)*R2, om = (w - O)*R2, Or = O*R2;
  let E = M; for (let i = 0; i < 8; i++) E = E - (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));
  const x = a*(Math.cos(E) - e), y = a*Math.sqrt(1 - e*e)*Math.sin(E);
  const co = Math.cos(om), so = Math.sin(om), cO = Math.cos(Or), sO = Math.sin(Or), cI = Math.cos(I), sI = Math.sin(I);

const RP = Math.PI / 180, nrm = x => ((x % 360) + 360) % 360;
function helio(el, T){
  const a = el[0] + el[1]*T, e = el[2] + el[3]*T, I = (el[4] + el[5]*T)*RP, L = el[6] + el[7]*T, w = el[8] + el[9]*T, O = el[10] + el[11]*T;

  const x = a*(Math.cos(E) - e), y = a*Math.sqrt(1 - e*e)*Math.sin(E);
  const co = Math.cos(om), so = Math.sin(om), cO = Math.cos(Or), sO = Math.sin(Or), cI = Math.cos(I);
  return [(co*cO - so*sO*cI)*x + (-so*cO - co*sO*cI)*y, (co*sO + so*cO*cI)*x + (-so*sO + co*cO*cI)*y];
}

// Luna fuera de curso: desde su último aspecto mayor (0,60,90,120,180) a Sol..Plutón hasta que cambia de signo
function lunaFueraDeCurso(desde, hasta, longLuna, longSolar, longPlaneta, PLANETAS){
  const jd0 = desde.getTime() / 86400000 + 2440587.5, jd1 = hasta.getTime() / 86400000 + 2440587.5;
  const sig = jd => Math.floor(longLuna(jd) / 30);
  const ingresos = [];
  for (let jd = jd0 - 3; jd < jd1 + 1; jd += 1/24) {
    if (sig(jd) !== sig(jd + 1/24)) { let a = jd, b = jd + 1/24; for (let i = 0; i < 12; i++) { const m = (a + b) / 2; if (sig(m) === sig(a)) a = m; else b = m; } ingresos.push(b); }
  }
  const asp = [0, 60, 90, 120, 180, 240, 270, 300];
  const dif = (jd) => { const l = longLuna(jd); const cuerpos = [longSolar(jd)].concat(PLANETAS.map(p => longPlaneta(p, jd))); return cuerpos.map(c => asp.map(A => ((l - c - A) % 360 + 540) % 360 - 180)); };
  const ventanas = [];
  for (let i = 1; i < ingresos.length; i++) {
    const tIn = ingresos[i], tPrev = ingresos[i - 1], paso = 1/96;
    let inicio = tPrev, sigD = dif(tIn - 1e-4);
    for (let t = tIn - paso; t > tPrev; t -= paso) {
      const d = dif(t);
      let cruce = false;
      for (let c = 0; c < d.length && !cruce; c++) for (let k = 0; k < asp.length; k++) { const x = d[c][k], y = sigD[c][k]; if (Math.abs(x) < 10 && Math.abs(y) < 10 && ((x < 0) !== (y < 0))) { cruce = true; break; } }
      if (cruce) { inicio = t + paso / 2; break; }
      sigD = d;
    }
    const a = new Date((inicio - 2440587.5) * 86400000), b = new Date((tIn - 2440587.5) * 86400000);
    if (b > desde && a < hasta) ventanas.push({ desde: a, hasta: b });
  }
  return ventanas;
}

const sinTildes = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
function reducirNum(n, maestros){ while (n > 9 && !(maestros && (n === 11 || n === 22 || n === 33))) n = String(n).split('').reduce((a, c) => a + +c, 0); return n; }
const VAL_LETRA = l => { const c = l.charCodeAt(0) - 65; return c >= 0 && c < 26 ? (c % 9) + 1 : 0; };
function numerologia(fechaDDMM, anioNac, nombre){
  const out = {};
  if (fechaDDMM && anioNac) {
    const m = fechaDDMM.match(/(\d{2})\/(\d{2})/);
    out.camino = reducirNum((m[1] + m[2] + anioNac).split('').reduce((a, c) => a + +c, 0), true);
    const hoy = new Date(), y = hoy.getFullYear();
    out.anio = reducirNum((m[1] + m[2] + y).split('').reduce((a, c) => a + +c, 0), false);
    out.mes = reducirNum(out.anio + hoy.getMonth() + 1, false);
    out.dia = reducirNum(out.mes + hoy.getDate(), false);
  }
  const letras = sinTildes(nombre || '').replace(/[^A-Z]/g, '');
  if (letras) {
    const suma = f => reducirNum(letras.split('').filter(f).reduce((a, l) => a + VAL_LETRA(l), 0), true);
    out.expresion = suma(() => true);
    out.alma = suma(l => 'AEIOU'.includes(l));
    out.personalidad = suma(l => !'AEIOU'.includes(l));
  }
  return out;
}

function jsonp(url){
  return new Promise((ok, mal) => {
    const nombre = 'luzguia_cb_' + Date.now();
    const sc = document.createElement('script');
    const fin = () => { delete window[nombre]; sc.remove(); };
    const t = setTimeout(() => { fin(); mal(new Error('sin respuesta')); }, 25000);
    window[nombre] = data => { clearTimeout(t); fin(); ok(data); };
    sc.onerror = () => { clearTimeout(t); fin(); mal(new Error('el script no respondió')); };
    sc.src = url + '&callback=' + nombre;
    document.head.appendChild(sc);
  });
}

function cualidades(){
  const n = numerologia(P.diaMes, P.anioNac, P.nombreCompleto || P.nombre);
  const pts = {}; CUALIDADES.forEach(c => pts[c] = 2);
  const sumar = (num, peso) => { const m = CUAL_NUM[num]; if (m) Object.entries(m).forEach(([c, v]) => pts[c] += v * peso); };
  sumar(n.camino, 1.5); sumar(n.expresion, 1); sumar(n.alma, 1); sumar(n.personalidad, .6);
  if (P.arcano && CUAL_ARC[+P.arcano.n]) CUAL_ARC[+P.arcano.n].split(' ').forEach((c, i) => pts[c] += i ? 2 : 3);
  const max = Math.max(...Object.values(pts));
  const out = CUALIDADES.map(c => ({ c, v: Math.max(3, Math.round(pts[c] / max * 10)) }));
  return out;
}

function chinoDe(diaMes, anio){
  const m = String(diaMes || '').match(/(\d{2})\/(\d{2})/); if (!m || !anio) return null;
  anio = +anio; const nac = new Date(anio, +m[2] - 1, +m[1]);
  const nv = lunas(new Date(anio, 0, 21), new Date(anio, 1, 21)).find(x => !x.llena);
  const y = nv && nac < new Date(nv.fecha.getFullYear(), nv.fecha.getMonth(), nv.fecha.getDate()) ? anio - 1 : anio;
  return { an: CHINO[((y - 1900) % 12 + 12) % 12], el: CHINO_EL[Math.floor(((y % 10) + 10) % 10 / 2)], anio: y };
}

function radarSVG(cs){
  const R = 92, cx = 150, cy = 130, n = cs.length, pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  let s = `<svg class="radar" viewBox="0 0 300 260" role="img" aria-label="Gráfico de tus cualidades">`;
  [.33, .66, 1].forEach(f => s += `<polygon points="${cs.map((x, i) => pt(i, R * f).join(',')).join(' ')}" fill="none" stroke="rgba(185,138,230,.28)"/>`);
  cs.forEach((x, i) => { const [x2, y2] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="rgba(185,138,230,.2)"/>`; });
  s += `<polygon points="${cs.map((x, i) => pt(i, R * x.v / 10).join(',')).join(' ')}" fill="rgba(212,175,106,.35)" stroke="#D4AF6A" stroke-width="2"/>`;
  cs.forEach((x, i) => { const [x2, y2] = pt(i, R * x.v / 10); s += `<circle cx="${x2}" cy="${y2}" r="3" fill="#F3DCA0"/>`; const [lx, ly] = pt(i, R + 22); s += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="11" fill="#E3D6F2" font-family="Jost, sans-serif">${x.c}</text>`; });
  return s + '</svg>';
}

  // Cada mes chino empieza cuando el Sol llega a 315°, 345°, 15°... (términos solares)
  const out = []; let d = new Date(y, 0, 20, 12), prev = longSolar(jdDe(d));
  for (let i = 0; i < 400 && out.length < 13; i++) {
    d = new Date(d.getTime() + 86400000); const l = longSolar(jdDe(d));

  }

}

function calcRacha(s){
  const set = new Set(s.dias), d = new Date(); d.setHours(0, 0, 0, 0);
  let n = 0; while (set.has(isoLocal(d))) { n++; d.setDate(d.getDate() - 1); }

  s.dias.slice().sort().forEach(k => { const f = new Date(k + 'T12:00'); cur = prev && Math.round((f - prev) / 86400000) === 1 ? cur + 1 : 1; prev = f; if (cur > max) max = cur; });

}

    PREM_ABIERTA = 'natal'; TAB = 'premium';
    await cargar();
    $('dlg-titulo').textContent = '¡Tu prueba empezó! ✷';
    $('dlg-texto').textContent = 'Tenés todo Premium hasta el ' + d.hasta + '. Empezá por tu carta natal, tu semana o la sinastría con quien quieras.';
    $('dlg-cuerpo').innerHTML = '<div class="fila-bt"><button class="btn" type="button" id="dlg-ok">Ver mi Premium</button></div>';
    $('dlg').showModal(); $('dlg-ok').onclick = () => $('dlg').close();
  } catch (e) { btn.disabled = false; btn.textContent = '✨ Empezar mi prueba gratis'; alert(e.message || 'No se pudo activar la prueba.'); }
}

/* Tirada del mes y meditaciones */
const MES_N = { enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12 };
function mesDe(x){
  const t = String(x.mes || '').trim().toLowerCase(); let m;
  if ((m = t.match(/^(\d{4})-(\d{1,2})/))) return +m[1] * 12 + (+m[2] - 1);
  if ((m = t.match(/(\d{1,2})\/(\d{4})$/))) return +m[2] * 12 + (+m[1] - 1);
  if ((m = t.match(/([a-zé]+)\s*(?:de\s*)?(\d{4})/)) && MES_N[m[1]]) return +m[2] * 12 + MES_N[m[1]] - 1;
  if ((m = String(x.fecha || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return +m[3] * 12 + (+m[2] - 1);
  return null;
}
const nombreMes = k => MESES[k % 12].charAt(0).toUpperCase() + MESES[k % 12].slice(1) + ' ' + Math.floor(k / 12);
function embedHTML(url, titulo){
  const u = String(url || '').trim(); if (!u) return '';
  let m;
  if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/))([\w-]{11})/))) return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0" title="${esc(titulo)}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  if ((m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([-\w]{20,})/))) return `<div class="video"><iframe src="https://drive.google.com/file/d/${m[1]}/preview" title="${esc(titulo)}" loading="lazy" allow="autoplay" allowfullscreen></iframe></div>`;
  if ((m = u.match(/open\.spotify\.com\/(episode|track|show|playlist)\/(\w+)/))) return `<iframe class="spotify" src="https://open.spotify.com/embed/${m[1]}/${m[2]}" title="${esc(titulo)}" loading="lazy" allow="encrypted-media"></iframe>`;
  if (/\.(mp3|m4a|ogg|wav|aac)(\?|$)/i.test(u)) return `<audio controls preload="none" src="${esc(u)}"></audio>`;
  if (/\.(mp4|webm|mov)(\?|$)/i.test(u)) return `<div class="video"><video controls preload="none" src="${esc(u)}"></video></div>`;
  const red = /instagram/.test(u) ? 'Instagram' : /tiktok/.test(u) ? 'TikTok' : /soundcloud/.test(u) ? 'SoundCloud' : '';
  return `<p><a class="btn-sec" href="${esc(u)}" target="_blank" rel="noopener">${red ? 'Ver en ' + red : 'Abrir'} ↗</a></p>`;
}
function itemContenido(x, abierto){
  return `<details class="cont-item"${abierto ? ' open' : ''}><summary><b>${esc(x.titulo)}</b>${x.k != null ? `<small>${nombreMes(x.k)}</small>` : ''}</summary>
    <div>${x.desc ? `<p>${esc(x.desc)}</p>` : ''}${x.enlace ? embedHTML(x.enlace, x.titulo) : '<p class="ag-ayuda">El enlace todavía no está cargado.</p>'}</div></details>`;
}
function premTirada(){
  const hoy = new Date(), kHoy = hoy.getFullYear() * 12 + hoy.getMonth();
  const L = (P.contenido || []).filter(x => /tirada/i.test(x.tipo || '')).map(x => Object.assign({ k: mesDe(x) }, x)).filter(x => x.k == null || x.k <= kHoy).sort((a, b) => (b.k || 0) - (a.k || 0));
  const actual = L.find(x => x.k === kHoy), pasadas = L.filter(x => x !== actual);
  let h = '<p>Cada mes, Mey tira las cartas para la energía colectiva: qué se mueve, qué conviene soltar y qué se abre. Las de meses anteriores quedan guardadas para volver a verlas.</p>';
  h += actual ? `<p class="sub">${nombreMes(kHoy)}</p>` + itemContenido(actual, true)
    : `<div class="lugar-mes"><b>🔮 La tirada de ${MESES[hoy.getMonth()]} está por llegar</b><p>Mey la publica en los primeros días del mes. Te avisamos apenas esté.</p></div>`;
  if (pasadas.length) h += '<p class="sub">Meses anteriores</p>' + pasadas.map(x => itemContenido(x, false)).join('');
  return h;
}
function premMeditaciones(){
  const L = (P.contenido || []).filter(x => !/tirada/i.test(x.tipo || '')).map(x => Object.assign({ k: null }, x)).reverse();
  let h = '<p>Meditaciones guiadas grabadas por Belu y Mey: para la Luna nueva, para soltar, para la abundancia, para conectar con tus guías. Ponete auriculares, buscá un lugar tranquilo y dejate llevar.</p>';
  if (!L.length) return h + '<div class="lugar-mes"><b>🎧 La primera meditación llega muy pronto</b><p>Estamos grabándolas con mucho amor. Te avisamos cuando esté.</p></div>';
  const med = L.filter(x => /medita/i.test(x.tipo || '')), otros = L.filter(x => !/medita/i.test(x.tipo || ''));
  h += med.map((x, i) => itemContenido(x, i === 0)).join('');
  if (otros.length) h += '<p class="sub">Más para vos</p>' + otros.map(x => itemContenido(x, false)).join('');
  return h;
}
(function(){
  const i = PREMIUM_LISTA.findIndex(x => x[0] === 'meditaciones');
  if (i > -1) PREMIUM_LISTA[i] = ['meditaciones', '🎧', 'Meditaciones de Luz Guía', 'Meditaciones guiadas grabadas por Belu y Mey para cada momento.'];
  const j = PREMIUM_LISTA.findIndex(x => x[0] === 'mes');
  PREMIUM_LISTA.splice(j + 1, 0, ['tirada', '🎥', 'La tirada del mes', 'Mey tira las cartas para la energía colectiva de cada mes, en video.']);
  PREM_FN.tirada = () => premTirada(); PREM_FN.meditaciones = () => premMeditaciones();
})();

/* "¿Pudiste reservar?" al día siguiente de consultar */
const SEG_MOTIVOS = ['Todavía no me respondieron', 'Lo estoy pensando', 'Por el precio', 'Ya no me interesa', 'Otro'];
function preguntaSeguimiento(){
  const L = (P.seguimientos || []).filter(x => !(lsGet('luzguia_seg_ok', []) || []).includes(x.fila));
  if (!L.length || lsGet('luzguia_seg_despues', '') === isoLocal(new Date()) || $('dlg').open) return;
  const x = L[0], prod = /Producto|Kit/.test(x.tipo);
  $('dlg-titulo').textContent = x.tipo === 'Encuentro' ? '¿Pudiste reservar tu lugar?' : prod ? '¿Pudiste concretar tu compra?' : '¿Pudiste reservar?';
  $('dlg-texto').innerHTML = `Hace poco nos consultaste por <b>${esc(x.que)}</b>. Contanos cómo te fue así te ayudamos mejor 💜`;
  $('dlg-cuerpo').innerHTML = `<div class="fila-bt seg-bt"><button class="btn" type="button" data-seg="si">Sí ✨</button><button class="btn-sec" type="button" data-seg="no">Todavía no</button></div>
    <div class="seg-paso oculto" id="seg-si">${x.tipo === 'Promoción' ? '<label class="seg-lab" for="seg-dia">¿Para qué día quedó?</label><input type="date" id="seg-dia" class="campo-codigo">' : ''}<div class="fila-bt"><button class="btn" type="button" data-segenviar="Sí">Listo</button></div></div>
    <div class="seg-paso oculto" id="seg-no"><p class="seg-lab">¿Qué pasó?</p><div class="seg-motivos">${SEG_MOTIVOS.map(m => `<button class="chip-m" type="button" data-segmotivo="${esc(m)}">${esc(m)}</button>`).join('')}</div></div>
    <p style="text-align:center;margin:12px 0 0"><button class="link" type="button" data-seg="despues">Preguntame otro día</button></p>`;
  $('dlg').dataset.segFila = x.fila; $('dlg').dataset.segTipo = x.tipo;
  $('dlg').showModal();
}
async function enviarSeguimiento(reservo, motivo){
  const fila = +$('dlg').dataset.segFila, dia = $('seg-dia') ? $('seg-dia').value : '';
  $('dlg-cuerpo').innerHTML = '<p style="text-align:center">Guardando…</p>';
  let ok = false;
  try { const r = await fetch(API, { method: 'POST', body: JSON.stringify({ accion: 'seguimiento', codigo: CODIGO, fila, reservo, dia, motivo: motivo || '' }) }); const d = await r.json(); ok = d.ok; } catch (e) {}
  const hechos = lsGet('luzguia_seg_ok', []) || []; hechos.push(fila); lsSet('luzguia_seg_ok', hechos.slice(-60));
  P.seguimientos = (P.seguimientos || []).filter(x => x.fila !== fila);
  $('dlg-titulo').textContent = reservo === 'Sí' ? '¡Qué lindo! ✨' : '¡Gracias por contarnos! 💜';
  const wa = waLuz('Hola! Soy ' + P.nombre + '. Les había consultado desde Mi Luz y quería saber si pudieron verlo 🌙');
  $('dlg-texto').textContent = reservo === 'Sí' ? 'Nos alegra muchísimo. Te esperamos.' : motivo === 'Todavía no me respondieron' ? 'Perdón por la demora. Ya les avisamos a Belu y Mey para que te escriban hoy.' : 'Cuando quieras, acá estamos.';
  $('dlg-cuerpo').innerHTML = `<div class="fila-bt" style="justify-content:center">${motivo === 'Todavía no me respondieron' && wa ? `<a class="wa" href="${wa}" target="_blank" rel="noopener">${WA_SVG} Escribirles</a>` : ''}<button class="btn-sec" type="button" id="dlg-ok">Cerrar</button></div>${ok ? '' : '<p class="ag-ayuda">No pudimos guardarlo ahora, pero no te preocupes.</p>'}`;
  $('dlg-ok').onclick = () => { $('dlg').close(); setTimeout(preguntaSeguimiento, 600); };
}

/* Lo que pasa al abrir */
function postCarga(){
  registrarDia(); revisarLogros(true);
  const r = document.querySelector('.racha'); if (r) r.outerHTML = rachaHTML();
  if (P.onesignal && avisosActivos()) iniciarAvisos();
  if (!lsGet('luzguia_tour_v1', 0)) { TOUR_I = 0; setTimeout(mostrarTour, 700); }
  else setTimeout(preguntaSeguimiento, 1800);
}

// Agrega lo nuevo a Hoy y a Premium sin tocar lo que ya funcionaba
const _hoyBase = hoyHTML;
hoyHTML = function(){
  let h = _hoyBase();
  const inv = invitarHTML();
  h = h.includes('<div class="instalar">') ? h.replace('<div class="instalar">', inv + '<div class="instalar">') : h + inv;
  return rachaHTML() + avisosHTML() + h;
};
const _premBase = premiumHTML;
premiumHTML = function(){
  let h = _premBase();
  if (P.premium && !P.organizadora && P.pruebaUsada && P.premiumHasta && !VISTA_GRATIS) {
    const d = diasHasta(P.premiumHasta);
    if (d !== null && d <= (P.pruebaDias || 7)) h = h.replace(/<p class="prem-org">Tu Premium está activo hasta el [^<]*<\/p>/, `<p class="prem-org">Estás usando tu prueba gratis: ${d <= 0 ? 'termina hoy' : d === 1 ? 'te queda 1 día' : 'te quedan ' + d + ' días'} (hasta el ${esc(P.premiumHasta)}) ✨<br><button class="btn-sec" type="button" data-quiero-premium style="margin-top:8px">Quiero seguir con Premium</button></p>`);
  }
  const pr = pruebaHTML();
  if (pr) h = h.replace('<div class="prem-cta">', pr + '<div class="prem-cta">');
  return h;
};

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tirada !== undefined && P) {
    const s = RACHA || estadoRacha(), n = cartaTirada(+b.dataset.tirada);
    if (!s.arc.includes(n)) s.arc.push(n); RACHA = s; lsSet(RK, s); setTimeout(() => revisarLogros(), 900); return;
  }
  if (b.dataset.share || b.id === 'btn-compartir' || b.dataset.compdia !== undefined) { const s = RACHA || estadoRacha(); s.comp = (s.comp || 0) + 1; RACHA = s; lsSet(RK, s); setTimeout(() => revisarLogros(), 2500); return; }
  if (b.dataset.logros !== undefined) { const c = $('logros-caja'); c.classList.toggle('oculto'); b.setAttribute('aria-expanded', !c.classList.contains('oculto')); return; }
  if (b.dataset.invitar !== undefined) {
    const txt = textoInvitacion(), s = RACHA || estadoRacha(); s.inv = (s.inv || 0) + 1; RACHA = s; lsSet(RK, s);
    evento('Invitó', b.dataset.invitar === 'otro' ? 'Otra app' : 'WhatsApp');
    if (b.dataset.invitar === 'otro' && navigator.share) { try { await navigator.share({ text: txt }); } catch (x) {} }
    else window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
    setTimeout(() => revisarLogros(), 1500); return;
  }
  if (b.dataset.avisos !== undefined) { activarAvisos(b); return; }
  if (b.dataset.avisosno !== undefined) { lsSet('luzguia_avisos_no', isoLocal(new Date())); const c = b.closest('.avisos-caja'); if (c) c.remove(); return; }
  if (b.dataset.tour) {
    const a = b.dataset.tour, n = pasosTour().length;
    if (a === 'sig') { TOUR_I = Math.min(n - 1, TOUR_I + 1); mostrarTour(); }
    else if (a === 'atras') { TOUR_I = Math.max(0, TOUR_I - 1); mostrarTour(); }
    else if (a === 'avisos') { cerrarTour(); activarAvisos(null); }
    else if (a === 'instalar') { cerrarTour(); const bi = $('btn-instalar'); if (bi) bi.click(); else guiaInstalar(); }
    else cerrarTour();
    return;
  }
  if (b.dataset.prueba !== undefined) { empezarPrueba(b); return; }
  if (b.dataset.pruebademo !== undefined) { $('dlg-titulo').textContent = 'Es una vista previa ✷'; $('dlg-texto').textContent = 'Como sos organizadora ya tenés todo. A una participante este botón le activa Premium por ' + (P.pruebaDias || 7) + ' días al instante, una sola vez, y a ustedes les llega un mail.'; $('dlg-cuerpo').innerHTML = '<div class="fila-bt"><button class="btn" type="button" id="dlg-ok">Entendido</button></div>'; $('dlg').showModal(); $('dlg-ok').onclick = () => $('dlg').close(); return; }
  if (b.dataset.seg) {
    const a = b.dataset.seg;
    if (a === 'despues') { lsSet('luzguia_seg_despues', isoLocal(new Date())); $('dlg').close(); return; }
    if (a === 'si' && /Producto|Kit|Encuentro/.test($('dlg').dataset.segTipo)) { enviarSeguimiento('Sí'); return; }
    document.querySelector('.seg-bt').classList.add('oculto');
    $(a === 'si' ? 'seg-si' : 'seg-no').classList.remove('oculto'); return;
  }
  if (b.dataset.segenviar) { enviarSeguimiento(b.dataset.segenviar); return; }
  if (b.dataset.segmotivo) { enviarSeguimiento('No', b.dataset.segmotivo); return; }
});

document.querySelectorAll('img[data-logo]').forEach(i => i.src = document.querySelector('link[rel=icon]').href);
cargar();
